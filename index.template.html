<title>La Tour aux Aimants</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
  /* Layout : tout le jeu vit dans une scène fixe de 1280×800 (#app), mise à l'échelle pour remplir l'écran en paysage,
     et tournée de 90° si la tablette est tenue en portrait. Univers unique : nuit violette de la tour, lanternes dorées. */
  :root {
    --bg: #1b1430; --panel: #2a2145; --panel-2: #3a2f5c; --fg: #fff6e6; --muted: #c9bfdc;
    --accent: #ffb020; --accent-ink: #2b1a00; --sky: #7ad3ff; --ok: #3fbf5a; --red: #e0453a; --blue: #2f6fd6;
    --display: 'Fredoka', 'Trebuchet MS', 'Segoe UI', sans-serif; --body: 'Nunito', 'Segoe UI', Helvetica, Arial, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 18px;
    padding-block: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  #app { position: fixed; left: 0; top: 0; width: 1280px; height: 800px; transform-origin: 0 0; background: var(--bg); overflow: hidden; border-radius: 12px; }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; box-sizing: border-box; }
  .screen.in { animation: fadeIn .35s ease-out both; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
  @keyframes lineIn { from { opacity: 0; transform: translateX(-12px) } to { opacity: 1; transform: none } }
  @keyframes popIn { 0% { transform: scale(.9) } 60% { transform: scale(1.06) } 100% { transform: scale(1) } }
  @keyframes pulse { 0% { transform: scale(1) } 40% { transform: scale(1.12) } 100% { transform: scale(1) } }
  @keyframes wiggle { 0%, 100% { transform: rotate(0) } 25% { transform: rotate(-4deg) } 75% { transform: rotate(4deg) } }
  @keyframes bob { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
  @media (prefers-reduced-motion: reduce) { .screen.in, #intro p, #cardText p, .floor.current, button.pulse, .floor.current .mark img, #end img { animation: none !important; } }
  h1, h2, h3 { font-family: var(--display); font-weight: 700; margin: 0; text-wrap: balance; }
  button { font-family: var(--display); font-weight: 600; font-size: 26px; color: var(--accent-ink); background: var(--accent); border: 0; border-radius: 999px;
    padding: 14px 30px; cursor: pointer; box-shadow: 0 4px 0 #b57700; touch-action: manipulation; transition: transform .08s ease-out, filter .15s; }
  button:hover { filter: brightness(1.06); }
  button:active { transform: translateY(3px) scale(.98); box-shadow: 0 1px 0 #b57700; }
  button:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }
  button.ghost { background: var(--panel-2); color: var(--fg); box-shadow: 0 4px 0 #1a1230; }
  button:disabled { opacity: 0.5; cursor: default; }
  button.pulse { animation: pulse .35s ease-out; }
  .row { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; align-items: center; }

  /* titre */
  #title .bgimg { position: absolute; inset: 0; background: url(assets/tour.jpg) center/cover no-repeat; opacity: 0.6; }
  #title > * { position: relative; }
  #title h1 { font-size: 84px; color: var(--accent); text-shadow: 0 5px 0 #5a3a00, 0 12px 36px rgba(0,0,0,0.6); }
  #intro { background: rgba(27,20,48,0.85); border-radius: 24px; padding: 18px 30px; max-width: 700px; text-align: center; font-size: 30px; font-weight: 800; line-height: 1.4; }
  #intro p { margin: 4px 0; animation: lineIn .5s ease-out both; }

  /* tour */
  #tower { flex-direction: row; gap: 40px; padding: 20px 40px; }
  #floors { display: flex; flex-direction: column; gap: 4px; width: 560px; }
  .floor { display: grid; grid-template-columns: 50px 1fr 60px; align-items: center; gap: 12px; text-align: left; border-radius: 12px; padding: 4px 16px;
    background: var(--panel); color: var(--fg); box-shadow: inset 0 0 0 2px #4a3d6a; font-size: 21px; min-height: 40px; }
  .floor .num { font-family: var(--display); font-size: 24px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .floor .name { font-family: var(--body); font-weight: 800; display: flex; align-items: center; gap: 14px; }
  .floor .mark { font-size: 28px; color: var(--ok); text-align: center; line-height: 1; }
  .floor .mark img { height: 44px; width: auto; vertical-align: middle; animation: wiggle 1.6s ease-in-out infinite; }
  .floor.done { opacity: 0.85; }
  .floor.current { background: var(--accent); color: var(--accent-ink); box-shadow: 0 0 0 4px #ffd27a, 0 6px 20px rgba(255,176,32,0.5); animation: popIn .6s ease-out both; min-height: 52px; }
  .floor.current .num { color: var(--accent-ink); }
  .floor.locked { opacity: 0.35; box-shadow: none; }
  .dots { display: inline-flex; gap: 5px; }
  .dots i, #hudDots i { display: inline-block; width: 13px; height: 13px; border-radius: 50%; background: rgba(255,255,255,0.25); box-shadow: inset 0 0 0 2px rgba(0,0,0,0.25); }
  .dots i.atelier, #hudDots i.atelier { border-radius: 3px; }
  .dots i.ok, #hudDots i.ok { background: var(--ok); }
  .floor.current .dots i { background: rgba(0,0,0,0.2); } .floor.current .dots i.ok { background: #1f7a33; }
  #towerSide { display: flex; flex-direction: column; align-items: center; gap: 22px; width: 420px; }
  #stairs svg { display: block; max-height: 400px; width: auto; }
  #towerSide p { margin: 0; font-size: 24px; font-weight: 800; text-align: center; color: var(--muted); }

  /* fiche */
  .cardBox { background: var(--panel); border-radius: 30px; padding: 36px 48px; display: grid; grid-template-columns: 1.15fr 1fr; gap: 40px; align-items: center; width: 1120px; box-sizing: border-box; box-shadow: 0 10px 40px rgba(0,0,0,0.4); }
  .cardBox .eyebrow { font-family: var(--display); color: var(--accent); font-size: 22px; letter-spacing: 0.08em; text-transform: uppercase; }
  .cardBox h2 { font-size: 54px; margin-bottom: 10px; }
  #cardText { font-size: 38px; font-weight: 800; line-height: 1.45; }
  #cardText p { margin: 3px 0; animation: lineIn .5s ease-out both; }
  #cardSvg { background: #fff6e6; border-radius: 20px; padding: 12px; }
  #cardSvg svg { width: 100%; height: auto; display: block; }

  /* jeu */
  #canvas { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; touch-action: none; display: block; }
  #hud { position: absolute; left: 0; top: 0; width: 1280px; height: 90px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 16px;
    background: linear-gradient(#141020, #231a3a); border-bottom: 3px solid #4a3d6a; }
  #hud .left { display: flex; flex-direction: column; min-width: 150px; }
  #hud .left b { font-family: var(--display); color: var(--accent); font-size: 23px; line-height: 1.1; }
  #hud .left span { font-weight: 800; font-size: 19px; line-height: 1.1; display: inline-flex; align-items: center; }
  #hudDots { display: inline-flex; gap: 6px; margin-left: 10px; }
  #hudDots i { width: 15px; height: 15px; }
  #hudDots i.now { background: var(--accent); box-shadow: 0 0 0 3px rgba(255,176,32,0.35); }
  #hudTools { display: flex; gap: 8px; }
  #hud button { font-size: 20px; padding: 10px 18px; box-shadow: 0 3px 0 #b57700; display: inline-flex; align-items: center; gap: 8px; }
  #hud button.ghost { box-shadow: 0 3px 0 #1a1230; }
  #hud button.tool { background: var(--panel-2); color: var(--fg); box-shadow: 0 3px 0 #1a1230; }
  #hud button.tool.on { background: var(--sky); color: #06243a; box-shadow: 0 3px 0 #2a7aa8; }
  #hud .spacer { flex: 1; }
  #hud button { touch-action: none; }
  #btnOn { background: #4a4f56; color: #fff; box-shadow: 0 3px 0 #26292d; min-width: 120px; }
  #btnOn.on { background: #ffd24a; color: var(--accent-ink); box-shadow: 0 3px 0 #b57700; }
  #btnFilings.on { background: var(--sky); color: #06243a; }
  #btnShow { background: var(--sky); color: #06243a; box-shadow: 0 3px 0 #2a7aa8; }
  .pole { display: inline-flex; border-radius: 6px; overflow: hidden; margin-left: 6px; }
  .pole b { width: 26px; text-align: center; color: #fff; }
  .pole b:first-child { background: var(--blue); } .pole b:last-child { background: var(--red); }
  .pole.flip b:first-child { background: var(--red); } .pole.flip b:last-child { background: var(--blue); }
  .ico { display: inline-block; width: 32px; height: 12px; border-radius: 3px; background: linear-gradient(90deg, var(--blue) 50%, var(--red) 50%); }
  .ico.hs { width: 20px; height: 20px; border: 6px solid var(--red); border-bottom: 0; border-radius: 20px 20px 0 0; background: none; box-sizing: border-box; }
  #gauge { font-size: 17px; font-weight: 800; color: var(--muted); }
  #hint { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--fg); color: #2b1a00; border-radius: 20px; padding: 14px 24px; font-size: 23px; font-weight: 800;
    max-width: 900px; box-shadow: 0 8px 30px rgba(0,0,0,0.5); cursor: pointer; }
  #hint::after { content: ''; position: absolute; left: 50%; bottom: -12px; border: 12px solid transparent; border-top-color: var(--fg); border-bottom: 0; transform: translateX(-50%); }

  /* fin */
  #end img { height: 400px; width: auto; animation: bob 2.4s ease-in-out infinite; }
  #end h2 { font-size: 70px; color: var(--accent); }
  #end p { font-size: 28px; font-weight: 800; text-align: center; margin: 0; }

  button.small { font-size: 20px; padding: 10px 20px; }
  #iosHint { background: rgba(27,20,48,0.85); border-radius: 14px; padding: 10px 18px; font-size: 19px; font-weight: 800; color: var(--muted); }
  #iosHint .share { display: inline-block; border: 2px solid var(--sky); color: var(--sky); border-radius: 6px; padding: 0 8px; margin: 0 2px; }
  #rotateHint { position: fixed; left: 0; right: 0; bottom: 8px; text-align: center; font-size: 14px; color: var(--muted); pointer-events: none; }
</style>

<div id="app">
  <section id="title" class="screen">
    <div class="bgimg" aria-hidden="true"></div>
    <h1>La Tour aux Aimants</h1>
    <div id="intro"></div>
    <div class="row">
      <button id="btnIntroRead" class="ghost" type="button">🔊 Écouter</button>
      <button id="btnPlay" type="button">Jouer</button>
      <button id="btnFull" class="ghost" type="button">⛶ Plein écran</button>
    </div>
    <div class="row">
      <button id="btnReset" class="ghost small" type="button" hidden>Recommencer la tour</button>
      <button id="btnInstall" class="small" type="button" hidden>📲 Installer sur l'appareil</button>
    </div>
    <div id="iosHint" hidden>Pour l'installer : bouton Partager <span class="share">⎙</span> puis « Sur l'écran d'accueil »</div>
  </section>

  <section id="tower" class="screen" hidden>
    <div id="floors" role="list"></div>
    <div id="towerSide">
      <div id="stairs" aria-label="Les 40 marches"></div>
      <p id="towerText"></p>
      <button id="btnClimb" type="button">Monter</button>
      <button id="btnHome" class="ghost" type="button">Accueil</button>
    </div>
  </section>

  <section id="card" class="screen" hidden>
    <div class="cardBox">
      <div>
        <div class="eyebrow" id="cardFloor">Étage 1</div>
        <h2 id="cardTitle"></h2>
        <div id="cardText"></div>
        <div class="row" style="justify-content:flex-start; margin-top:22px">
          <button id="btnRead" class="ghost" type="button">🔊 Écouter</button>
          <button id="btnGo" type="button">C'est parti !</button>
          <button id="btnCardBack" class="ghost" type="button">Retour</button>
        </div>
      </div>
      <div id="cardSvg"></div>
    </div>
  </section>

  <section id="game" class="screen" hidden>
    <canvas id="canvas" width="1280" height="800"></canvas>
    <div id="hud">
      <div class="left"><b id="hudFloor">Étage 1</b><span><span id="hudTitle"></span><span id="hudDots"></span></span></div>
      <div id="hudTools"></div>
      <button id="btnFlip" class="ghost" type="button" hidden>↻ Retourner</button>
      <button id="btnOn" type="button" hidden>ÉTEINT</button>
      <button id="btnTurn" class="ghost" type="button" hidden>+ 1 tour</button>
      <button id="btnFilings" class="ghost" type="button" hidden>Limaille</button>
      <span id="gauge" hidden></span>
      <span class="spacer"></span>
      <button id="btnShow" type="button" hidden>Montre-moi</button>
      <button id="btnFullHud" class="ghost" type="button" aria-label="Plein écran">⛶</button>
      <button id="btnHint" class="ghost" type="button" aria-label="Indice">?</button>
      <button id="btnRestart" class="ghost" type="button" aria-label="Recommencer">↺</button>
      <button id="btnTower" class="ghost" type="button" aria-label="Retour à la tour">🏰</button>
    </div>
    <div id="hint" hidden><span id="hintText"></span></div>
  </section>

  <section id="end" class="screen" hidden>
    <img src="assets/chat_saute.png" alt="Le chat libre">
    <h2>Bravo !</h2>
    <p>Tu as délivré le chat.<br>Seize étages, et la sorcière est partie.</p>
    <button id="btnEndHome" type="button">Retour à l'accueil</button>
  </section>
</div>
<div id="rotateHint" hidden>Tourne la tablette pour jouer en grand</div>
