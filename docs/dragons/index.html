      { at: .33, cd: .95, pool: [['breath', { dur: 2.4, sweep: 1.7 }], ['meteors', { n: 7, gap: .3, split: 6 }], ['lightning', { n: 5, spread: 1.4, rep: 2, gap: .9 }], ['spiral', { arms: 5, dur: 2.6, rate: .13, rot: -2.2, spd: 180, col: 'gold' }], ['charge', { ring: 14 }]] },
    ] }] },
];

const WORLDS = [

  { id: 'dmg', name: "Pointes d'acier", desc: 'Dégâts +25 %', icon: '⚔️', max: 5, apply: p => { p.dmg *= 1.25; } },
  { id: 'crit', name: 'Œil de lynx', desc: 'Coups critiques x2', icon: '🎯', max: 3, apply: p => { p.crit += .15; } },

// ------------------------------------------------------------------ motifs d'attaque (générateurs : yield = attente en secondes)
const P = {
  aimed: function* (g, d, o) {
    for (let i = 0; i < o.n; i++) { g.fire(d, g.aimAt(d) + (g.rand() - .5) * (o.jit || .08), o.spd, o); g.sfx('spit'); yield o.gap; }
  },
  fan: function* (g, d, o) {
    for (let k = 0; k < (o.rep || 1); k++) {
      const a0 = g.aimAt(d) + (k % 2 ? (o.spread / Math.max(1, o.n - 1)) / 2 : 0);
      for (let i = 0; i < o.n; i++) g.fire(d, a0 + (i - (o.n - 1) / 2) * o.spread / Math.max(1, o.n - 1), o.spd, o);
      g.sfx('fire'); g.mouthFx(d);
      if (k < (o.rep || 1) - 1) yield o.gap || .6;
    }
  },
  shards: function* (g, d, o) { yield* P.fan(g, d, Object.assign({ kind: 'shard', bounce: 1, r: 8 }, o)); },
  ring: function* (g, d, o) {
    for (let k = 0; k < (o.rep || 1); k++) {
      const off = g.rand() * TAU, gc = g.aimAt(d) + (g.rand() - .5) * 1.6;
      for (let i = 0; i < o.n; i++) {
        const a = off + i * TAU / o.n;
        if (o.gapW && angDiff(a, gc) < o.gapW / 2) continue;
        g.fire(d, a, o.spd, o);
      }
      g.sfx('fire'); g.mouthFx(d);
      if (k < (o.rep || 1) - 1) yield o.every || .6;
    }
  },
  spiral: function* (g, d, o) {
    let a = g.aimAt(d) + Math.PI;
    const steps = Math.floor(o.dur / o.rate);
    for (let i = 0; i < steps; i++) {
      for (let k = 0; k < o.arms; k++) g.fire(d, a + k * TAU / o.arms, o.spd, o);
      if (i % 3 === 0) g.sfx('spit');
      a += o.rot * o.rate; yield o.rate;
    }
  },
  homing: function* (g, d, o) {
    for (let i = 0; i < o.n; i++) { g.fire(d, g.aimAt(d) + (i - (o.n - 1) / 2) * .5, o.spd, Object.assign({ r: 12, kind: 'snow', life: 6 }, o)); g.sfx('spit'); yield o.gap; }
  },
  breath: function* (g, d, o) {
    const dir = g.rand() < .5 ? -1 : 1, base = g.aimAt(d);
    d.breath = o.dur; g.sfx('breath');
    const n = Math.floor(o.dur / .035);
    for (let i = 0; i < n; i++) {
      const t = i / n, a = base + (t - .5) * o.sweep * dir + (g.rand() - .5) * .14;
      g.fire(d, a, 250 + g.rand() * 90, { kind: 'flame', r: 9, life: 1.9, col: d.col === 'ice' ? 'ice' : 'fire' });
      yield .035;
    }
    d.breath = 0;
  },
  meteors: function* (g, d, o) {
    g.sfx('roarS');
    for (let i = 0; i < o.n; i++) {
      const p = g.player, R = i === 0 ? 0 : 110;
      const x = clamp(p.x + (g.rand() - .5) * 2 * R, A.l + 20, A.r - 20), y = clamp(p.y + (g.rand() - .5) * 2 * R, A.t + 120, A.b - 20);
      g.hazards.push({ kind: 'meteor', x, y, t: 0, warn: 1.15, R: 48, split: o.split || 0, col: d.col });
      g.sfx('warn');
      yield o.gap;
    }
  },
  lightning: function* (g, d, o) {
    for (let k = 0; k < (o.rep || 1); k++) {
      const m = g.mouth(d), base = g.aimAt(d) + (k % 2 ? o.spread / Math.max(1, o.n) / 2 : 0);
      for (let i = 0; i < o.n; i++) {
        const a = base + (o.n > 1 ? (i - (o.n - 1) / 2) * o.spread / (o.n - 1) : 0);
        g.hazards.push({ kind: 'bolt', x: m.x, y: m.y, a, t: 0, warn: .85, dur: .28, w: 13 });
      }
      g.sfx('charge');
      yield o.gap || 1;
    }
    yield .6;
  },
  charge: function* (g, d, o) {
    const p = g.player;
    const tx = clamp(p.x, A.l + d.w * .2, A.r - d.w * .2), ty = clamp(p.y, A.t + 120, A.b - 70);
    const hz = { kind: 'lane', x0: d.x, y0: d.y, x1: tx, y1: ty, w: d.w * .36, t: 0, dur: .85, d };
    g.hazards.push(hz); d.tremble = .85; g.sfx('roarS');
    yield .85;
    d.dash = { tx, ty, spd: o.spd || 900 }; g.sfx('whoosh');
    while (d.dash) yield .02;
    g.shake(12); g.sfx('boom'); g.dustRing(d.x, d.y + d.h * .3, d.w * .5);
    if (o.ring) { const off = g.rand() * TAU; for (let i = 0; i < o.ring; i++) g.fire(d, off + i * TAU / o.ring, 150, { fromBody: true }); }
    d.charging = false; d.home = true;
    yield .7;
  },
  summon: function* (g, d, o) {
    g.sfx('roarS'); d.tremble = .5; yield .4;
    for (let i = 0; i < o.n; i++) {
      if (g.enemies.filter(e => e.minion && !e.dead).length >= o.max) break;
      g.spawnWhelp(d.x + (i % 2 ? 1 : -1) * d.w * .35, d.y + 10);
      yield .35;
    }
  },
};

// ------------------------------------------------------------------ le jeu
class Game {
  constructor(opts = {}) {
    this.headless = !!opts.headless;
    this.rand = mulberry32(opts.seed || ((Date.now() * 9301) | 0));
    this.sfx = opts.sfx || (() => {});
    this.store = opts.store || null;
    this.t = 0;
    this.newRun();
    this.state = 'title';
  }

  newPlayer() {
    return { x: 270, y: 800, r: 11, hp: 5, maxHp: 5, inv: 0, speed: 245, dmg: 10, rate: 2.6, multi: 0, diag: 0, crit: 0, burn: 0,
      shieldMax: 0, shield: 0, shieldCd: 0, fireCd: 0, still: 0, face: 1, walk: 0, moving: false, recoil: 0, flash: 0, target: null, hits: 0 };
  }
  newRun() {
    this.player = this.newPlayer();
    this.ups = {}; this.gems = 0; this.levelIdx = 0; this.runTime = 0; this.deaths = 0;
    this.clearRoom();
  }
  clearRoom() {
    this.enemies = []; this.bullets = []; this.arrows = []; this.hazards = []; this.parts = []; this.texts = []; this.gemsArr = []; this.pickups = []; this.decals = [];
    this.door = 0; this.shakeAmt = 0; this.slowT = 0; this.freeze = 0; this.hurtFlash = 0; this.banner = null; this.cards = null; this.trans = null; this.stateT = 0;
  }
  get level() { return LEVELS[this.levelIdx]; }
  get world() { return WORLDS[this.level.world]; }

  // ---- sauvegarde
  save() { if (this.store) this.store.set({ level: this.levelIdx + 1, ups: this.ups, gems: this.gems }); }
  savedLevel() { const s = this.store && this.store.get(); return s && s.level > 0 && s.level < LEVELS.length ? s.level : 0; }

  // ---- actions (boutons)
  startNew() { this.newRun(); this.startLevel(0); }
  continueGame() {
    const s = this.store && this.store.get(); if (!s) return this.startNew();
    this.newRun(); this.gems = s.gems || 0;
    for (const id in (s.ups || {})) for (let i = 0; i < s.ups[id]; i++) this.applyUp(id, true);
    this.player.hp = this.player.maxHp;
    this.startLevel(s.level || 0);
  }
  retry() { this.deaths++; const p = this.player; p.hp = p.maxHp; p.shield = p.shieldMax; this.startLevel(this.levelIdx); }
  applyUp(id, silent) {
    const u = UPS.find(u => u.id === id); if (!u) return;
    this.ups[id] = (this.ups[id] || 0) + 1; u.apply(this.player);
    if (!silent) this.sfx('up');
  }
  chooseUpgrade(i) {
    if (this.state !== 'upgrade' || !this.cards || this.cards.picked != null) return;
    const c = this.cards.list[i]; if (!c) return;
    this.cards.picked = i; this.cards.pt = 0;
    this.applyUp(c.id);
    const p = this.player; p.hp = Math.min(p.maxHp, p.hp + 1); p.shield = p.shieldMax;
    this.save();
    this.ring(p.x, p.y, 70, '#ffe36b'); this.burst(p.x, p.y - 20, 24, ['#fff3a0', '#ffd23a', '#ffffff'], 260);
  }

  startLevel(i) {
    this.levelIdx = i; this.clearRoom();
    const L = this.level, p = this.player;
    p.x = 270; p.y = 990; p.inv = 0; p.fireCd = .3; p.still = 0; p.target = null;
    for (const b of L.bosses) {
      const ty = DT[b.t];
      const e = { boss: true, type: ty, t: b.t, w: b.w, h: b.w * ty.ar, x: b.x || 270, y: -200, baseY: b.y || 300, hp: b.hp, maxHp: b.hp, lag: b.hp,
        phases: b.phases, phase: 0, col: ty.col, spd: b.spd || 60, side: b.side || 0, gen: null, wait: 0, cd: 1.1 + (b.delay || 0), last: null,
        tx: b.x || 270, ty: b.y || 300, retarget: 2, flash: 0, tremble: 0, roar: 0, dash: null, burnT: 0, burnTick: 0, burnDps: 0, dying: 0, dead: false, anim: this.rand() * 10, tell: 0, breath: 0, entered: false, sx: b.x || 270 };
      this.enemies.push(e);
    }
    this.state = 'intro'; this.stateT = 0;
    this.banner = { t: 0, idx: i, name: L.name, sub: L.sub, king: !!L.king };
  }

  // ---- utilitaires de tir
  mouth(d) { return { x: d.x, y: d.y + d.h * d.type.mouth }; }
  aimAt(d) { const m = this.mouth(d), p = this.player; return Math.atan2(p.y - m.y, p.x - m.x); }
  fire(d, a, spd, o = {}) {
    const m = o.fromBody ? { x: d.x, y: d.y } : this.mouth(d);
    const b = { x: m.x, y: m.y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, r: o.r || 9, col: o.col || d.col, life: o.life || 8, t: 0,
      kind: o.kind || 'orb', bounce: o.bounce || 0, hom: o.hom || 0, homT: o.homT || 0, spd };
    this.bullets.push(b); return b;
  }
  spawnWhelp(x, y) {
    const ty = DT.vert;
    this.enemies.push({ minion: true, type: ty, t: 'vert', w: 64, h: 64 * ty.ar, x, y, hp: 45, maxHp: 45, lag: 45, col: 'green', vx: 0, vy: 0,
      cd: 1.6 + this.rand(), flash: 0, anim: this.rand() * 10, burnT: 0, burnTick: 0, burnDps: 0, dead: false, spawn: .45 });
    this.puff(x, y, '#9dff6a', 14);
  }

  // ---- effets (rien en mode headless)
  part(o) { if (!this.headless && this.parts.length < 900) this.parts.push(o); }
  burst(x, y, n, cols, spd = 200, size = 4, opts = {}) {
    if (this.headless) return;
    for (let i = 0; i < n; i++) {
      const a = this.rand() * TAU, s = spd * (.3 + Math.random() * .7);
      this.part(Object.assign({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: .35 + Math.random() * .45, max: .8, size: size * (.6 + Math.random() * .8), col: cols[i % cols.length], kind: 'spark', drag: 3, add: true }, opts));
    }
  }
  puff(x, y, col, n = 10) {
    if (this.headless) return;
    for (let i = 0; i < n; i++) { const a = Math.random() * TAU, s = 30 + Math.random() * 90; this.part({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 20, life: .6 + Math.random() * .5, max: 1.1, size: 10 + Math.random() * 12, col, kind: 'smoke', drag: 2.5 }); }
  }
  ring(x, y, R, col, w = 6) { this.part({ x, y, vx: 0, vy: 0, life: .45, max: .45, size: R, col, kind: 'ring', w }); }
  dustRing(x, y, R) { this.ring(x, y, R, 'rgba(255,240,220,.8)', 10); this.puff(x, y, 'rgba(200,190,170,.5)', 16); }
  mouthFx(d) { const m = this.mouth(d); this.burst(m.x, m.y, 8, [COL[d.col].glow, COL[d.col].core], 140, 5); }
  text(x, y, str, col = '#fff', size = 22) { if (!this.headless && this.texts.length < 60) this.texts.push({ x, y, vy: -70, t: 0, str, col, size }); }
  shake(a) { this.shakeAmt = Math.max(this.shakeAmt, a); }
  explosion(x, y, s = 1, col = 'fire') {
    if (this.headless) return;
    const c = COL[col] || COL.fire;
    this.part({ x, y, vx: 0, vy: 0, life: .22, max: .22, size: 90 * s, col: '#ffffff', kind: 'flash' });
    this.ring(x, y, 110 * s, c.glow, 12 * s);
    this.burst(x, y, Math.floor(26 * s), [c.core, c.glow, '#ffffff', '#ffd27a'], 420 * s, 7 * s);
    for (let i = 0; i < 10 * s; i++) { const a = Math.random() * TAU, sp = 40 + Math.random() * 120 * s; this.part({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 30, life: .8 + Math.random() * .7, max: 1.5, size: (16 + Math.random() * 20) * s, col: 'rgba(60,45,50,.55)', kind: 'smoke', drag: 2 }); }
  }

  // ---- dégâts
  hurtPlayer(src) {
    const p = this.player;
    if (p.inv > 0 || this.state === 'dead' || this.godMode) { if (this.godMode && p.inv <= 0) { p.hits++; p.inv = 1.0; } return false; }
    if (p.shield > 0) {
      p.shield--; p.shieldCd = 8; p.inv = .9; this.sfx('shield');
      this.ring(p.x, p.y - 20, 60, '#7fe8ff', 8); this.burst(p.x, p.y - 20, 20, ['#bff4ff', '#7fe8ff', '#ffffff'], 260);
      this.text(p.x, p.y - 70, 'Bloqué !', '#9ef0ff', 24);
      return true;
    }
    p.hp--; p.hits++; p.inv = 1.3; p.flash = .15;
    this.hurtFlash = .5; this.shake(14); this.freeze = .07; this.sfx('hurt');
    this.burst(p.x, p.y - 20, 22, ['#ff4b4b', '#ffd0d0', '#ffffff'], 300);
    if (p.hp <= 0) { this.state = 'dead'; this.stateT = 0; this.slowT = 1.2; this.sfx('lose'); this.explosion(p.x, p.y - 20, .7, 'storm'); }
    return true;
  }
  damage(e, dmg, crit, burn) {
    if (e.dead || e.dying) return;
    e.hp -= dmg;
    if (!burn) e.flash = .06;
    this.text(e.x + (Math.random() - .5) * e.w * .4, e.y - e.h * .1 + (Math.random() - .5) * 30, String(Math.round(dmg)) + (crit ? '!' : ''), burn ? '#ffa53d' : crit ? '#ffe04a' : '#ffffff', crit ? 30 : burn ? 17 : 21);
    if (e.boss && e.phases) {
      const next = e.phases[e.phase + 1];
      if (next && e.hp / e.maxHp <= next.at) this.phaseUp(e);
    }
    if (e.hp <= 0) this.kill(e);
  }
  phaseUp(e) {
    e.phase++; e.roar = 1; e.tremble = .9; this.shake(16); this.sfx('roar');
    this.ring(e.x, e.y, e.w * .8, COL[e.col].glow, 14);
    this.text(e.x, e.y - e.h * .5, 'Il se fâche !', '#ff6a5a', 26);
    const p = this.player;
    if (p.hp < p.maxHp) this.pickups.push({ kind: 'heart', x: clamp(e.x, A.l + 40, A.r - 40), y: e.y + e.h * .4, vy: 0, t: 0, land: clamp(p.y - 150, A.t + 260, A.b - 120) });
  }
  kill(e) {
    e.hp = 0;
    if (e.minion) {
      e.dead = true; this.explosion(e.x, e.y, .5, 'green'); this.spawnGems(e.x, e.y, 3); this.sfx('pop'); return;
    }
    e.dying = 1.5; e.gen = null; e.dash = null; this.sfx('roar'); this.shake(10);
    if (this.enemies.every(x => !x.boss || x.dying || x.dead)) {
      // victoire : on nettoie l'écran
      this.state = 'victory'; this.stateT = 0; this.slowT = .9;
      for (const b of this.bullets) this.burst(b.x, b.y, 3, ['#fff7c0', '#ffe066'], 80, 3);
      this.bullets = []; this.hazards = this.hazards.filter(h => h.kind === 'scorch');
      for (const m of this.enemies) if (m.minion && !m.dead) this.kill(m);
    }
  }
  spawnGems(x, y, n) {
    for (let i = 0; i < n; i++) {
      const a = this.rand() * TAU, s = 120 + this.rand() * 260;
      this.gemsArr.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, z: 0, vz: 180 + this.rand() * 200, c: i % 4 });
    }
  }

  // ================================================================== mise à jour
  update(dtReal, input) {
    dtReal = Math.min(dtReal, 1 / 20);
    this.t += dtReal;
    if (this.paused) return;
    if (this.freeze > 0) { this.freeze -= dtReal; return; }
    let dt = dtReal;
    if (this.slowT > 0) { this.slowT -= dtReal; dt *= .35; }
    this.stateT += dtReal;
    if (this.state === 'title') { this.updateFx(dt); return; }
    if (['intro', 'fight', 'walk'].includes(this.state)) this.runTime += dtReal;

    const st = this.state;
    if (st === 'intro') this.updateIntro(dt, input);
    else if (st === 'fight') this.updatePlayer(dt, input, true);
    else if (st === 'victory' || st === 'loot') this.updatePlayer(dt, input, false);
    else if (st === 'upgrade') { if (this.cards && this.cards.picked != null) { this.cards.pt += dtReal; if (this.cards.pt > .9) { this.cards = null; this.state = 'open'; this.stateT = 0; this.sfx('door'); this.shake(5); } } }
    else if (st === 'open') { this.door = Math.min(1, this.stateT / 1.1); if (this.stateT > 1.1) { this.state = 'walk'; this.stateT = 0; } }
    else if (st === 'walk') { this.updatePlayer(dt, input, false); this.checkDoor(); }
    else if (st === 'transition') { this.updateTransition(dtReal); return; }
    else if (st === 'dead') { /* figé, l'écran de défaite s'affiche */ }

    this.updateEnemies(dt);
    this.updateArrows(dt);
    this.updateBullets(dt);
    this.updateHazards(dt);
    this.updatePickups(dt);
    this.updateFx(dt);

    if (st === 'victory') {
      if (this.stateT > 1.2 && !this.enemies.some(e => e.boss && !e.dead)) { this.state = 'loot'; this.stateT = 0; }
    } else if (st === 'loot') {
      if (this.stateT > 1.5 && this.gemsArr.length === 0 || this.stateT > 3) {
        if (this.levelIdx >= LEVELS.length - 1) { this.state = 'end'; this.stateT = 0; this.sfx('fanfare'); if (this.store) this.store.set(null); }
        else { this.state = 'upgrade'; this.stateT = 0; this.cards = { list: this.pickCards(), picked: null, pt: 0 }; this.sfx('cards'); }
      }
    }
  }

  pickCards() {
    const avail = UPS.filter(u => (this.ups[u.id] || 0) < u.max);
    const out = [];
    while (out.length < 3 && avail.length) out.push(avail.splice(Math.floor(this.rand() * avail.length), 1)[0]);
    return out;
  }

  updateIntro(dt, input) {
    const p = this.player, T = this.stateT;
    // le héros entre par le bas
    if (T < .8) { p.y = lerp(990, 800, ease.out(T / .8)); p.moving = true; p.walk += dt * 10; }
    else this.updatePlayer(dt, input, false);
    for (const e of this.enemies) {
      const d = clamp((T - .3) / 1.4, 0, 1);

// ------------------------------------------------------------------ ambiance
function updAmbient(dt, wi, t) {
  const rate = wi === 1 ? 22 : wi === 2 ? 3 : 5;
  if (Math.random() < rate * dt) {
    if (wi === 1) ambient.push({ x: Math.random() * W * 1.2 - 60, y: -10, vx: 20 + Math.random() * 20, vy: 40 + Math.random() * 40, s: 1.5 + Math.random() * 2.5, life: 20, wi });
    else if (wi === 2) ambient.push({ x: Math.random() < .5 ? Math.random() * A.l : A.r + Math.random() * (W - A.r), y: H + 10, vx: (Math.random() - .5) * 20, vy: -40 - Math.random() * 50, s: 1 + Math.random() * 1.2, life: 12, wi });
    else ambient.push({ x: Math.random() * W, y: 200 + Math.random() * 700, vx: (Math.random() - .5) * 8, vy: -4 - Math.random() * 6, s: 1 + Math.random() * 1.5, life: 6, wi });
  }
  for (const a of ambient) { a.x += (a.vx + Math.sin(t + a.y * .02) * 10) * dt; a.y += a.vy * dt; a.life -= dt; }
  for (let i = ambient.length - 1; i >= 0; i--) if (ambient[i].life <= 0 || ambient[i].wi !== wi || ambient[i].y > H + 20 || ambient[i].y < -20) ambient.splice(i, 1);
}
function drawAmbient(ctx) {
  for (const a of ambient) {
    const k = Math.min(1, a.life);
    if (a.wi === 2) { ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = .45 * k; ctx.drawImage(glow('#ff7a1a'), a.x - a.s * 4, a.y - a.s * 4, a.s * 8, a.s * 8); ctx.globalCompositeOperation = 'source-over'; }

  }
  ctx.globalAlpha = 1;
}

// ------------------------------------------------------------------ rendu principal
R.draw = function (ctx, game, dt, joy) {
  const t = game.t;
  R.buttons = [];
  const st = game.state;
  const wi = st === 'title' ? 0 : game.level.world;
  updAmbient(dt, st === 'transition' && game.trans.t > game.trans.dur / 2 && game.levelIdx + 1 < LEVELS.length ? LEVELS[game.levelIdx + 1].world : wi, t);
  if (st === 'title') { drawTitle(ctx, game, t, game.savedLevel()); return; }

  ctx.save();
  if (game.shakeAmt > 0) ctx.translate((Math.random() - .5) * game.shakeAmt, (Math.random() - .5) * game.shakeAmt);
  let cam = 0;
  if (st === 'transition') {
    const tr = game.trans, k = ease.inOut(clamp(tr.t / tr.dur, 0, 1)); cam = k * H;
    const nwi = LEVELS[Math.min(LEVELS.length - 1, game.levelIdx + 1)].world;
    drawRoom(ctx, game, nwi, cam - H, 0, t);
    drawRoom(ctx, game, wi, cam, 1, t);
    drawAmbient(ctx);
    const p = game.player, py = lerp(DOOR.y - 20, 800, k);
    drawShadow(ctx, p.x, py + 2, 20);
    drawHero(ctx, p, game, t, py);
    ctx.restore();
    ctx.drawImage(VIGNETTE, 0, 0);
    return;
  }
  drawRoom(ctx, game, wi, 0, game.door, t);
  // décalques
  for (const d of game.decals) { const a = .5 * Math.min(1, (6 - d.t) / 2); const g = ctx.createRadialGradient(d.x, d.y, 0, d.x, d.y, d.r); g.addColorStop(0, `rgba(15,8,8,${a})`); g.addColorStop(1, 'rgba(15,8,8,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(d.x, d.y, d.r, d.r * .6, 0, 0, TAU); ctx.fill(); }
  for (const h of game.hazards) drawHazardGround(ctx, h, t);
  // ombres
  const p = game.player;
  for (const e of game.enemies) if (!e.dead) { const gy = dragonGround(e, game); const k = st === 'intro' ? clamp((e.y + e.h) / (e.baseY + e.h), .2, 1) : 1; drawShadow(ctx, e.x, e.minion ? e.y + e.h * .7 : gy, e.w * .3 * k * (1 - .05 * Math.sin(e.anim * 5.5)), .32 * k); }
  drawShadow(ctx, p.x, p.y + 2, 20);
  for (const k of game.pickups) drawShadow(ctx, k.x, k.land + 6, 12, .25);
  // cible
  if (st === 'fight' && p.target && !p.moving) drawTarget(ctx, p.target, t);
  for (const g of game.gemsArr) drawGem(ctx, g, t);
  for (const k of game.pickups) { const y = k.y - 6 + Math.sin(t * 4 + k.t) * 4; ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = .6; ctx.drawImage(glow('#ff4d7a'), k.x - 30, y - 30, 60, 60); ctx.restore(); heart(ctx, k.x, y, 26, '#ff3b55'); }
  // entités triées par profondeur
  const ents = game.enemies.filter(e => !e.dead).map(e => ({ y: e.minion ? e.y + e.h * .5 : dragonGround(e, game) - 30, f: () => drawDragon(ctx, e, game, t) }));
  if (st !== 'dead' || game.stateT < .3) ents.push({ y: p.y, f: () => drawHero(ctx, p, game, t) });
  ents.sort((a, b) => a.y - b.y).forEach(o => o.f());
  for (const a of game.arrows) drawArrow(ctx, a);
  drawParts(ctx, game.parts, false);
  for (const b of game.bullets) drawBullet(ctx, b, t);
  for (const h of game.hazards) drawHazardAir(ctx, h, t);
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; drawParts(ctx, game.parts, true); ctx.restore();
  drawAmbient(ctx);
  // nombres
  for (const tx of game.texts) {
    const k = tx.t, s = k < .12 ? .6 + k / .12 * .6 : 1.2 - Math.min(.2, (k - .12));
    ctx.globalAlpha = k > .6 ? 1 - (k - .6) / .3 : 1;
    ctx.save(); ctx.translate(tx.x, tx.y); ctx.scale(s, s); txt(ctx, tx.str, 0, 0, tx.size, tx.col, 'center', '#1a0a14', 5); ctx.restore();
  }
  ctx.globalAlpha = 1;
  // flèche vers la porte
  if ((st === 'walk' || st === 'open') && game.door > .5) {
    const by = 190 + Math.sin(t * 6) * 8;
    ctx.save(); ctx.translate(DOOR.x, by); ctx.fillStyle = '#ffd34a'; ctx.strokeStyle = '#2a1206'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(0, -18); ctx.lineTo(20, 4); ctx.lineTo(8, 4); ctx.lineTo(8, 18); ctx.lineTo(-8, 18); ctx.lineTo(-8, 4); ctx.lineTo(-20, 4); ctx.closePath(); ctx.stroke(); ctx.fill(); ctx.restore();
  }
  ctx.restore(); // fin du tremblement

  ctx.drawImage(VIGNETTE, 0, 0);
  if (game.hurtFlash > 0) { ctx.fillStyle = `rgba(255,0,30,${game.hurtFlash * .35})`; ctx.fillRect(0, 0, W, H); }
  if (game.level.world === 2) { ctx.fillStyle = 'rgba(255,90,20,.05)'; ctx.fillRect(0, 0, W, H); }
  drawHUD(ctx, game, t);
  if (game.banner && st === 'intro') drawBanner(ctx, game.banner);
  // tuto
  if (game.levelIdx === 0 && game.deaths === 0 && st === 'fight' && game.stateT < 14) {
    if (p.moving) R.tutoMoved = true;
    const msg = !R.tutoMoved ? 'Glisse ton doigt pour bouger' : 'Arrête-toi pour tirer !';
    if (!(R.tutoMoved && game.stateT > 10)) { ctx.globalAlpha = .75 + .25 * Math.sin(t * 5); txt(ctx, msg, W / 2, 640, 26, '#ffffff', 'center', '#1a0a20', 6); ctx.globalAlpha = 1; }
  }

      ctx.scale(s, s); txt(ctx, 'VICTOIRE !', 0, 0, 66, '#ffd84a', 'center', '#2a0c04', 13); ctx.restore();

    ctx.globalAlpha = .55; ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.stroke();

    button(ctx, 'REPRENDRE', W / 2, 500, 270, 78, 'resume', '#ffbf2a', t);

R.bars = function (ctx, game, top, bottom) {

  for (let y = -44; y > -top - 44; y -= 44) for (let x = 0; x < W; x += 108) ctx.drawImage(room, 0, 44, 108, 44, x, y, 108, 44);
  let g = ctx.createLinearGradient(0, -top, 0, 0); g.addColorStop(0, 'rgba(5,4,10,.95)'); g.addColorStop(1, 'rgba(5,4,10,.55)');

<script>// ===== Chasseur de Dragons : son, contrôles, boucle =====
(function () {
'use strict';
const { W, H, Game } = DG;

// ------------------------------------------------------------------ son (synthétisé)
const Snd = {
  ctx: null, out: null, muted: false, last: {}, music: null,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    this.ctx = new AC(); this.out = this.ctx.createGain(); this.out.gain.value = this.muted ? 0 : .8;
    const comp = this.ctx.createDynamicsCompressor(); this.out.connect(comp); comp.connect(this.ctx.destination);
    const len = this.ctx.sampleRate; this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = this.noise.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.startMusic();
  },
  setMuted(m) { this.muted = m; if (this.out) this.out.gain.value = m ? 0 : .8; try { localStorage.setItem('dragon-mute', m ? '1' : ''); } catch (e) {} },
  tone(type, f0, f1, dur, vol, when = 0, dest) {
    const c = this.ctx, t = c.currentTime + when, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(dest || this.out); o.start(t); o.stop(t + dur + .05);
  },
  noiseHit(dur, vol, type, f0, f1, when = 0, q = 1) {
    const c = this.ctx, t = c.currentTime + when, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noise; s.playbackRate.value = 1; f.type = type; f.Q.value = q; f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.out); s.start(t, Math.random() * .5); s.stop(t + dur + .05);
  },
  play(name) {
    if (!this.ctx || this.muted) return;
    const now = this.ctx.currentTime, gap = { hit: .045, crit: .05, gem: .04, spit: .06, fire: .08, shoot: .05, pop: .08, warn: .12, tell: .2 }[name] || 0;
    if (gap && this.last[name] && now - this.last[name] < gap) return; this.last[name] = now;
    switch (name) {
      case 'shoot': this.noiseHit(.09, .18, 'bandpass', 3200, 900, 0, 2); this.tone('triangle', 900, 260, .08, .07); break;
      case 'hit': this.tone('square', 220, 90, .06, .05); this.noiseHit(.04, .12, 'highpass', 3000, 2000); break;
      case 'crit': this.tone('square', 520, 140, .09, .07); this.noiseHit(.07, .2, 'highpass', 4000, 2000); break;
      case 'spit': this.noiseHit(.12, .1, 'lowpass', 1800, 400); break;
      case 'fire': this.noiseHit(.22, .16, 'lowpass', 1400, 250); this.tone('sawtooth', 160, 70, .2, .04); break;
      case 'breath': this.noiseHit(1.6, .2, 'lowpass', 900, 300, 0, .7); break;
      case 'tell': this.tone('sine', 300, 600, .25, .05); break;
      case 'warn': this.tone('square', 880, 880, .07, .03); break;
      case 'charge': this.tone('sawtooth', 200, 1200, .6, .04); break;
      case 'zap': this.noiseHit(.3, .35, 'highpass', 5000, 1500); this.tone('square', 1200, 100, .25, .06); break;
      case 'whoosh': this.noiseHit(.45, .22, 'bandpass', 400, 2400, 0, 1.5); break;
      case 'roar': case 'roarS': {
        const L = name === 'roar' ? 1 : .55, c = this.ctx, t = c.currentTime, f = c.createBiquadFilter(), g = c.createGain();
        f.type = 'lowpass'; f.frequency.value = 900; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.3, t + .08); g.gain.exponentialRampToValueAtTime(.0001, t + L);

        f.connect(g); g.connect(this.out); this.noiseHit(L, .18, 'bandpass', 700, 300, 0, .8); break;
      }
      case 'boom': this.noiseHit(.8, .5, 'lowpass', 900, 60); this.tone('sine', 110, 30, .6, .35); break;
      case 'pop': this.noiseHit(.25, .25, 'lowpass', 1500, 100); this.tone('sine', 200, 50, .2, .15); break;
      case 'hurt': this.tone('square', 440, 110, .25, .1); this.noiseHit(.2, .25, 'bandpass', 1200, 300); break;
      case 'lose': [392, 330, 262, 196].forEach((f, i) => this.tone('triangle', f, f, .3, .12, i * .18)); break;
      case 'gem': this.tone('sine', 1320 + Math.random() * 400, 1320, .08, .05); this.tone('sine', 1980, 1980, .1, .03, .04); break;
      case 'heal': [660, 880, 1320].forEach((f, i) => this.tone('sine', f, f, .2, .08, i * .07)); break;
      case 'shield': this.tone('sine', 1500, 900, .4, .08); this.tone('sine', 2200, 1500, .3, .04, .03); break;
      case 'up': [523, 659, 784, 1047, 1319].forEach((f, i) => this.tone('triangle', f, f, .22, .1, i * .07)); break;
      case 'cards': [392, 523, 659].forEach((f, i) => this.tone('triangle', f, f, .18, .07, i * .09)); break;
      case 'door': this.noiseHit(1.1, .3, 'lowpass', 300, 80); this.tone('square', 60, 50, 1, .05); break;
      case 'fanfare': [523, 523, 523, 659, 784, 659, 784, 1047].forEach((f, i) => this.tone('square', f, f, i === 7 ? .8 : .16, .07, [0, .15, .3, .45, .75, .9, 1.05, 1.2][i])); break;
    }
  },
  // petite boucle musicale (la mineur), plus intense en combat
  startMusic() {
    const c = this.ctx, bus = c.createGain(); bus.gain.value = .5; bus.connect(this.out); this.musicBus = bus;
    const step = 60 / 132 / 4; let next = c.currentTime + .1, i = 0;
    const bass = [45, 45, 57, 45, 48, 48, 60, 48, 43, 43, 55, 43, 40, 40, 52, 47];
    const lead = [69, 0, 72, 0, 76, 0, 74, 72, 67, 0, 71, 0, 74, 0, 72, 71, 69, 0, 72, 76, 81, 0, 79, 76, 74, 0, 72, 0, 71, 0, 0, 0];
    const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
    const tick = () => {
      if (!this.ctx) return;
      while (next < c.currentTime + .15) {
        const when = next - c.currentTime, fight = this.intensity || 0;
        if (!this.muted && fight > 0) {
          const b = bass[Math.floor(i / 2) % 16];

          if (fight > .5) {
            if (i % 8 === 0 || i % 16 === 10) { this.tone('sine', 140, 40, .18, .35, when, bus); }
            if (i % 8 === 4) this.noiseHit(.12, .12, 'highpass', 1800, 900, when);
            if (i % 2 === 1) this.noiseHit(.03, .035, 'highpass', 7000, 6000, when);
            const l = lead[i % 32]; if (l && i % 64 >= 32) this.tone('square', mtof(l), mtof(l), step * 1.6, .025, when, bus);
          }
        }
        next += step; i++;
      }
    };
    setInterval(tick, 40);
  },
};

// ------------------------------------------------------------------ sauvegarde
const store = {
  get() { try { return JSON.parse(localStorage.getItem('dragon-save') || 'null'); } catch (e) { return null; } },
  set(v) { try { if (v) localStorage.setItem('dragon-save', JSON.stringify(v)); else localStorage.removeItem('dragon-save'); } catch (e) {} },
};

// ------------------------------------------------------------------ canvas & boucle
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let scale = 1, offX = 0, offY = 0, dpr = 1;
function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  const rc = cv.getBoundingClientRect(), vw = rc.width || window.innerWidth, vh = rc.height || window.innerHeight;
  cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr);
  scale = Math.min(vw / W, vh / H); offX = (vw - W * scale) / 2; offY = (vh - H * scale) / 2;
}
window.addEventListener('resize', resize); resize();

const game = new Game({ sfx: n => Snd.play(n), store });
window.__game = game;
try { Snd.muted = localStorage.getItem('dragon-mute') === '1'; } catch (e) {}
DR.muted = Snd.muted;

// ---- contrôles
const joy = { active: false, id: null, bx: 0, by: 0, dx: 0, dy: 0 };
const keys = {};
function toLogic(e) { const rc = cv.getBoundingClientRect(); return { x: (e.clientX - rc.left - offX) / scale, y: (e.clientY - rc.top - offY) / scale }; }
// ---- appli : installation, plein écran, bouton retour, écran allumé
const PWA = !!window.PWA;
const STANDALONE = (window.matchMedia && (matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches)) || navigator.standalone === true;
const IOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
let installPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; });
window.addEventListener('appinstalled', () => { installPrompt = null; });
DR.installMode = () => STANDALONE || !PWA ? null : installPrompt ? 'prompt' : IOS ? 'ios' : null;
async function install() { if (!installPrompt) return; try { installPrompt.prompt(); await installPrompt.userChoice; } catch (e) {} installPrompt = null; }
function goFullscreen() {
  if (!PWA || STANDALONE || IOS) return;
  const d = document.documentElement, f = d.requestFullscreen || d.webkitRequestFullscreen;
  if (f && !document.fullscreenElement && !document.webkitFullscreenElement) { try { const p = f.call(d, { navigationUI: 'hide' }); if (p && p.catch) p.catch(() => {}); } catch (e) {} }
  try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('portrait').catch(() => {}); } catch (e) {}
}
let wake = null;
async function keepAwake() { try { if (navigator.wakeLock && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (!document.hidden && game.state !== 'title') keepAwake(); });
function enterGame() { goFullscreen(); keepAwake(); try { history.pushState({ g: 1 }, ''); } catch (e) {} }
window.addEventListener('popstate', () => {
  if (game.state === 'title') return;
  if (game.paused) { game.paused = false; game.state = 'title'; return; }
  game.paused = true; try { history.pushState({ g: 1 }, ''); } catch (e) {}
});
if (PWA && 'serviceWorker' in navigator && location.protocol === 'https:') window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });

function act(a) {
  if (a === 'mute') { Snd.setMuted(!Snd.muted); DR.muted = Snd.muted; return; }
  if (a === 'pause') { game.paused = true; return; }
  if (a === 'resume') { game.paused = false; return; }
  if (a === 'menu') { game.paused = false; game.state = 'title'; try { history.back(); } catch (e) {} return; }
  if (a === 'install') { install(); return; }
  if (a === 'new') { DR.tutoMoved = false; if (game.state === 'title') enterGame(); game.startNew(); return; }
  if (a === 'continue') { enterGame(); game.continueGame(); return; }
  if (a === 'retry') { game.retry(); return; }
  if (a.startsWith('card')) { game.chooseUpgrade(+a.slice(4)); return; }
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); Snd.init();
  const p = toLogic(e);
  for (const b of DR.buttons) if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) { act(b.action); return; }
  if (game.paused) return;
  if (!joy.active) { joy.active = true; joy.id = e.pointerId; joy.bx = p.x; joy.by = p.y; joy.dx = joy.dy = 0; try { cv.setPointerCapture(e.pointerId); } catch (er) {} }
});
cv.addEventListener('pointermove', e => {
  if (!joy.active || e.pointerId !== joy.id) return;
  const p = toLogic(e); let dx = (p.x - joy.bx) / 58, dy = (p.y - joy.by) / 58; const m = Math.hypot(dx, dy);
  if (m > 1) { joy.bx += (p.x - joy.bx) * (1 - 1 / m); joy.by += (p.y - joy.by) * (1 - 1 / m); dx /= m; dy /= m; }
  joy.dx = dx; joy.dy = dy;
});
const end = e => { if (e.pointerId === joy.id) { joy.active = false; joy.dx = joy.dy = 0; joy.id = null; } };
cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true; Snd.init();
  if (e.key === 'Enter' || e.key === ' ') {
    if (game.state === 'title') act(game.savedLevel() ? 'continue' : 'new');
    else if (game.state === 'dead' && game.stateT > 1.2) act('retry');
    else if (game.state === 'end' && game.stateT > 1.2) act('new');
  }
  if (game.state === 'upgrade' && ['1', '2', '3'].includes(e.key)) act('card' + (+e.key - 1));
  if (e.key.toLowerCase() === 'm') act('mute');
  if (e.key === 'Escape' || e.key.toLowerCase() === 'p') { if (game.paused) act('resume'); else if (game.state !== 'title') act('pause'); }
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden && ['fight', 'intro', 'walk'].includes(game.state)) game.paused = true; });
function input() {
  let x = 0, y = 0;
  if (keys.arrowleft || keys.a || keys.q) x -= 1; if (keys.arrowright || keys.d) x += 1;
  if (keys.arrowup || keys.w || keys.z) y -= 1; if (keys.arrowdown || keys.s) y += 1;
  if (x || y) return { x, y };
  if (joy.active) return { x: joy.dx, y: joy.dy };
  return { x: 0, y: 0 };
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  game.update(dt, input());
  Snd.intensity = ['fight', 'intro'].includes(game.state) ? 1 : ['walk', 'open', 'upgrade', 'victory', 'loot'].includes(game.state) ? .4 : 0;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#07050c'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, offX * dpr, offY * dpr);
  if (offY > 1) DR.bars(ctx, game, offY / scale, offY / scale);

const start = () => DR.load(window.ASSETS, () => { document.getElementById('load').style.display = 'none'; requestAnimationFrame(t => { last = t; frame(t); }); });

})();
</script>
