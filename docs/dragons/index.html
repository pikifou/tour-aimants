<title>Chasseur de Dragons</title>
<meta http-equiv="refresh" content="0; url=https://pikifou.github.io/chasseur-dragons/">
<script>
  // Ancienne adresse : on retire l'ancien service worker et son cache, puis on va à la nouvelle adresse.
  (async () => {
    try { const regs = await navigator.serviceWorker.getRegistrations(); for (const r of regs) if (r.scope.includes('/dragons/')) await r.unregister(); } catch (e) {}
    try { for (const k of await caches.keys()) if (k.startsWith('chasseur-dragons-')) await caches.delete(k); } catch (e) {}
    location.replace('https://pikifou.github.io/chasseur-dragons/');
  })();
</script>
