<title>La Tour aux Aimants</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
  /* Layout : tout le jeu vit dans une scène fixe de 1280×800 (#app), mise à l'échelle pour remplir l'écran en paysage,
     et tournée de 90° si la tablette est tenue en portrait. Univers unique : nuit violette de la tour, lanternes dorées. */
  :root {
    --bg: #1b1430; --panel: #2a2145; --panel-2: #3a2f5c; --fg: #fff6e6; --muted: #c9bfdc;
    --accent: #ffb020; --accent-ink: #2b1a00; --sky: #7ad3ff; --ok: #3fbf5a; --red: #e0453a; --blue: #2f6fd6;
    --display: 'Fredoka', 'Trebuchet MS', 'Segoe UI', sans-serif; --body: 'Nunito', 'Segoe UI', Helvetica, Arial, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 18px;
    padding-block: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  #app { position: fixed; left: 0; top: 0; width: 1280px; height: 800px; transform-origin: 0 0; background: var(--bg); overflow: hidden; border-radius: 12px; }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; box-sizing: border-box; }
  .screen.in { animation: fadeIn .35s ease-out both; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
  @keyframes lineIn { from { opacity: 0; transform: translateX(-12px) } to { opacity: 1; transform: none } }
  @keyframes popIn { 0% { transform: scale(.9) } 60% { transform: scale(1.06) } 100% { transform: scale(1) } }
  @keyframes pulse { 0% { transform: scale(1) } 40% { transform: scale(1.12) } 100% { transform: scale(1) } }
  @keyframes wiggle { 0%, 100% { transform: rotate(0) } 25% { transform: rotate(-4deg) } 75% { transform: rotate(4deg) } }
  @keyframes bob { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
  @media (prefers-reduced-motion: reduce) { .screen.in, #intro p, #cardText p, .floor.current, button.pulse, .floor.current .mark img, #end img { animation: none !important; } }
  h1, h2, h3 { font-family: var(--display); font-weight: 700; margin: 0; text-wrap: balance; }
  button { font-family: var(--display); font-weight: 600; font-size: 26px; color: var(--accent-ink); background: var(--accent); border: 0; border-radius: 999px;
    padding: 14px 30px; cursor: pointer; box-shadow: 0 4px 0 #b57700; touch-action: manipulation; transition: transform .08s ease-out, filter .15s; }
  button:hover { filter: brightness(1.06); }
  button:active { transform: translateY(3px) scale(.98); box-shadow: 0 1px 0 #b57700; }
  button:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }
  button.ghost { background: var(--panel-2); color: var(--fg); box-shadow: 0 4px 0 #1a1230; }
  button:disabled { opacity: 0.5; cursor: default; }
  button.pulse { animation: pulse .35s ease-out; }
  .row { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; align-items: center; }

  /* titre */
  #title .bgimg { position: absolute; inset: 0; background: url(assets/tour.jpg) center/cover no-repeat; opacity: 0.6; }
  #title > * { position: relative; }
  #title h1 { font-size: 84px; color: var(--accent); text-shadow: 0 5px 0 #5a3a00, 0 12px 36px rgba(0,0,0,0.6); }
  #intro { background: rgba(27,20,48,0.85); border-radius: 24px; padding: 18px 30px; max-width: 700px; text-align: center; font-size: 30px; font-weight: 800; line-height: 1.4; }
  #intro p { margin: 4px 0; animation: lineIn .5s ease-out both; }

  /* tour */
  #tower { flex-direction: row; gap: 40px; padding: 20px 40px; }
  #floors { display: flex; flex-direction: column; gap: 4px; width: 560px; }
  .floor { display: grid; grid-template-columns: 50px 1fr 60px; align-items: center; gap: 12px; text-align: left; border-radius: 12px; padding: 4px 16px;
    background: var(--panel); color: var(--fg); box-shadow: inset 0 0 0 2px #4a3d6a; font-size: 21px; min-height: 40px; }
  .floor .num { font-family: var(--display); font-size: 24px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .floor .name { font-family: var(--body); font-weight: 800; display: flex; align-items: center; gap: 14px; }
  .floor .mark { font-size: 28px; color: var(--ok); text-align: center; line-height: 1; }
  .floor .mark img { height: 44px; width: auto; vertical-align: middle; animation: wiggle 1.6s ease-in-out infinite; }
  .floor.done { opacity: 0.85; }
  .floor.current { background: var(--accent); color: var(--accent-ink); box-shadow: 0 0 0 4px #ffd27a, 0 6px 20px rgba(255,176,32,0.5); animation: popIn .6s ease-out both; min-height: 52px; }
  .floor.current .num { color: var(--accent-ink); }
  .floor.locked { opacity: 0.35; box-shadow: none; }
  .dots { display: inline-flex; gap: 5px; }
  .dots i, #hudDots i { display: inline-block; width: 13px; height: 13px; border-radius: 50%; background: rgba(255,255,255,0.25); box-shadow: inset 0 0 0 2px rgba(0,0,0,0.25); }
  .dots i.atelier, #hudDots i.atelier { border-radius: 3px; }
  .dots i.ok, #hudDots i.ok { background: var(--ok); }
  .floor.current .dots i { background: rgba(0,0,0,0.2); } .floor.current .dots i.ok { background: #1f7a33; }
  #towerSide { display: flex; flex-direction: column; align-items: center; gap: 22px; width: 420px; }
  #stairs svg { display: block; max-height: 400px; width: auto; }
  #towerSide p { margin: 0; font-size: 24px; font-weight: 800; text-align: center; color: var(--muted); }

  /* fiche */
  .cardBox { background: var(--panel); border-radius: 30px; padding: 36px 48px; display: grid; grid-template-columns: 1.15fr 1fr; gap: 40px; align-items: center; width: 1120px; box-sizing: border-box; box-shadow: 0 10px 40px rgba(0,0,0,0.4); }
  .cardBox .eyebrow { font-family: var(--display); color: var(--accent); font-size: 22px; letter-spacing: 0.08em; text-transform: uppercase; }
  .cardBox h2 { font-size: 54px; margin-bottom: 10px; }
  #cardText { font-size: 38px; font-weight: 800; line-height: 1.45; }
  #cardText p { margin: 3px 0; animation: lineIn .5s ease-out both; }
  #cardSvg { background: #fff6e6; border-radius: 20px; padding: 12px; }
  #cardSvg svg { width: 100%; height: auto; display: block; }

  /* jeu */
  #canvas { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; touch-action: none; display: block; }
  #hud { position: absolute; left: 0; top: 0; width: 1280px; height: 90px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 16px;
    background: linear-gradient(#141020, #231a3a); border-bottom: 3px solid #4a3d6a; }
  #hud .left { display: flex; flex-direction: column; min-width: 150px; }
  #hud .left b { font-family: var(--display); color: var(--accent); font-size: 23px; line-height: 1.1; }
  #hud .left span { font-weight: 800; font-size: 19px; line-height: 1.1; display: inline-flex; align-items: center; }
  #hudDots { display: inline-flex; gap: 6px; margin-left: 10px; }
  #hudDots i { width: 15px; height: 15px; }
  #hudDots i.now { background: var(--accent); box-shadow: 0 0 0 3px rgba(255,176,32,0.35); }
  #hudTools { display: flex; gap: 8px; }
  #hud button { font-size: 20px; padding: 10px 18px; box-shadow: 0 3px 0 #b57700; display: inline-flex; align-items: center; gap: 8px; }
  #hud button.ghost { box-shadow: 0 3px 0 #1a1230; }
  #hud button.tool { background: var(--panel-2); color: var(--fg); box-shadow: 0 3px 0 #1a1230; }
  #hud button.tool.on { background: var(--sky); color: #06243a; box-shadow: 0 3px 0 #2a7aa8; }
  #hud .spacer { flex: 1; }
  #btnOn { background: #4a4f56; color: #fff; box-shadow: 0 3px 0 #26292d; min-width: 120px; }
  #btnOn.on { background: #ffd24a; color: var(--accent-ink); box-shadow: 0 3px 0 #b57700; }
  #btnFilings.on { background: var(--sky); color: #06243a; }
  #btnShow { background: var(--sky); color: #06243a; box-shadow: 0 3px 0 #2a7aa8; }
  .pole { display: inline-flex; border-radius: 6px; overflow: hidden; margin-left: 6px; }
  .pole b { width: 26px; text-align: center; color: #fff; }
  .pole b:first-child { background: var(--blue); } .pole b:last-child { background: var(--red); }
  .pole.flip b:first-child { background: var(--red); } .pole.flip b:last-child { background: var(--blue); }
  .ico { display: inline-block; width: 32px; height: 12px; border-radius: 3px; background: linear-gradient(90deg, var(--blue) 50%, var(--red) 50%); }
  .ico.hs { width: 20px; height: 20px; border: 6px solid var(--red); border-bottom: 0; border-radius: 20px 20px 0 0; background: none; box-sizing: border-box; }
  #gauge { font-size: 17px; font-weight: 800; color: var(--muted); }
  #hint { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--fg); color: #2b1a00; border-radius: 20px; padding: 14px 24px; font-size: 23px; font-weight: 800;
    max-width: 900px; box-shadow: 0 8px 30px rgba(0,0,0,0.5); cursor: pointer; }
  #hint::after { content: ''; position: absolute; left: 50%; bottom: -12px; border: 12px solid transparent; border-top-color: var(--fg); border-bottom: 0; transform: translateX(-50%); }

  /* fin */
  #end img { height: 400px; width: auto; animation: bob 2.4s ease-in-out infinite; }
  #end h2 { font-size: 70px; color: var(--accent); }
  #end p { font-size: 28px; font-weight: 800; text-align: center; margin: 0; }

  button.small { font-size: 20px; padding: 10px 20px; }
  #iosHint { background: rgba(27,20,48,0.85); border-radius: 14px; padding: 10px 18px; font-size: 19px; font-weight: 800; color: var(--muted); }
  #iosHint .share { display: inline-block; border: 2px solid var(--sky); color: var(--sky); border-radius: 6px; padding: 0 8px; margin: 0 2px; }
  #rotateHint { position: fixed; left: 0; right: 0; bottom: 8px; text-align: center; font-size: 14px; color: var(--muted); pointer-events: none; }
</style>

<div id="app">
  <section id="title" class="screen">
    <div class="bgimg" aria-hidden="true"></div>
    <h1>La Tour aux Aimants</h1>
    <div id="intro"></div>
    <div class="row">
      <button id="btnIntroRead" class="ghost" type="button">🔊 Écouter</button>
      <button id="btnPlay" type="button">Jouer</button>
      <button id="btnFull" class="ghost" type="button">⛶ Plein écran</button>
    </div>
    <div class="row">
      <button id="btnReset" class="ghost small" type="button" hidden>Recommencer la tour</button>
      <button id="btnInstall" class="small" type="button" hidden>📲 Installer sur l'appareil</button>
    </div>
    <div id="iosHint" hidden>Pour l'installer : bouton Partager <span class="share">⎙</span> puis « Sur l'écran d'accueil »</div>
  </section>

  <section id="tower" class="screen" hidden>
    <div id="floors" role="list"></div>
    <div id="towerSide">
      <div id="stairs" aria-label="Les 40 marches"></div>
      <p id="towerText"></p>
      <button id="btnClimb" type="button">Monter</button>
      <button id="btnHome" class="ghost" type="button">Accueil</button>
    </div>
  </section>

  <section id="card" class="screen" hidden>
    <div class="cardBox">
      <div>
        <div class="eyebrow" id="cardFloor">Étage 1</div>
        <h2 id="cardTitle"></h2>
        <div id="cardText"></div>
        <div class="row" style="justify-content:flex-start; margin-top:22px">
          <button id="btnRead" class="ghost" type="button">🔊 Écouter</button>
          <button id="btnGo" type="button">C'est parti !</button>
          <button id="btnCardBack" class="ghost" type="button">Retour</button>
        </div>
      </div>
      <div id="cardSvg"></div>
    </div>
  </section>

  <section id="game" class="screen" hidden>
    <canvas id="canvas" width="1280" height="800"></canvas>
    <div id="hud">
      <div class="left"><b id="hudFloor">Étage 1</b><span><span id="hudTitle"></span><span id="hudDots"></span></span></div>
      <div id="hudTools"></div>
      <button id="btnFlip" class="ghost" type="button" hidden>↻ Retourner</button>
      <button id="btnOn" type="button" hidden>ÉTEINT</button>
      <button id="btnTurn" class="ghost" type="button" hidden>+ 1 tour</button>
      <button id="btnFilings" class="ghost" type="button" hidden>Limaille</button>
      <span id="gauge" hidden></span>
      <span class="spacer"></span>
      <button id="btnShow" type="button" hidden>Montre-moi</button>
      <button id="btnFullHud" class="ghost" type="button" aria-label="Plein écran">⛶</button>
      <button id="btnHint" class="ghost" type="button" aria-label="Indice">?</button>
      <button id="btnRestart" class="ghost" type="button" aria-label="Recommencer">↺</button>
      <button id="btnTower" class="ghost" type="button" aria-label="Retour à la tour">🏰</button>
    </div>
    <div id="hint" hidden><span id="hintText"></span></div>
  </section>

  <section id="end" class="screen" hidden>
    <img src="assets/chat_saute.png" alt="Le chat libre">
    <h2>Bravo !</h2>
    <p>Tu as délivré le chat.<br>Seize étages, et la sorcière est partie.</p>
    <button id="btnEndHome" type="button">Retour à l'accueil</button>
  </section>
</div>
<div id="rotateHint" hidden>Tourne la tablette pour jouer en grand</div>

<script>
/* Moteur du jeu « La Tour aux Aimants » : physique magnétique 2D, sans DOM.
   Fonctionne dans le navigateur (window.Engine) et dans Node (module.exports) pour les tests. */
(function (root) {
  'use strict';

  const W = 1280, H = 800;
  const G = 2200;                 // gravité px/s²
  const DT = 1 / 120;             // pas de simulation fixe

  // ---------- Outils (aimants tenus par le doigt, ou grue) ----------
  const TOOLS = {
    bar:       { label: 'Aimant',        strength: 22000,  range: 210, liftMass: 1,   poles: true,  holdOnly: true },
    double:    { label: 'Aimant double', strength: 32000, range: 340, liftMass: 2,   poles: true,  holdOnly: true },
    horseshoe: { label: 'Fer à cheval',  strength: 45000, range: 230, liftMass: 3.5, poles: true,  holdOnly: true },
    nail:      { label: 'Clou',          strength: 16000,  range: 170, liftMass: 0.5, poles: false, holdOnly: true },
    electro:   { label: 'Électroaimant', strength: 36000, range: 240, liftMass: 6,   poles: false, holdOnly: false },
    compass:   { label: 'Boussole',      strength: 0,     range: 0,   liftMass: 0,   poles: false, holdOnly: true },
  };

  // ---------- Corps : valeurs par défaut par type ----------
  const KINDS = {
    knight: { w: 70, h: 110, mat: 'iron', mass: 5,   tag: 'knight', maxSpeed: 380 },
    straw:  { w: 70, h: 110, mat: 'straw', mass: 5,  tag: 'straw' },
    sword:  { w: 26, h: 96,  mat: 'iron', mass: 1,   tag: 'blade', hook: true },
    bolt:   { w: 90, h: 20,  mat: 'iron', mass: 1,   rail: 'x' },
    ring:   { w: 44, h: 44,  mat: 'iron', mass: 0.5, chain: true },
    key:    { w: 54, h: 30,  mat: 'iron', mass: 0.5, chain: true },
    herse:  { w: 180, h: 150, mat: 'iron', mass: 3,  rail: 'y', gravity: true },
    lever:  { w: 30, h: 90,  mat: 'wood', mass: 1,   rail: 'y', grab: true },
    giant:  { w: 170, h: 64, mat: 'iron', mass: 7,   rail: 'x', pole: 'N' },
  };

  function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }
  function pointIn(p, r) { return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h; }
  function center(b) { return { x: b.x + b.w / 2, y: b.y + b.h / 2 }; }
  function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

  // Le segment p1-p2 coupe-t-il le rectangle r ? (Liang–Barsky)
  function segmentHitsRect(p1, p2, r) {
    let t0 = 0, t1 = 1;
    const dx = p2.x - p1.x, dy = p2.y - p1.y;
    const checks = [[-dx, p1.x - r.x], [dx, r.x + r.w - p1.x], [-dy, p1.y - r.y], [dy, r.y + r.h - p1.y]];
    for (const [p, q] of checks) {
      if (p === 0) { if (q < 0) return false; }
      else {
        const t = q / p;
        if (p < 0) { if (t > t1) return false; if (t > t0) t0 = t; }
        else { if (t < t0) return false; if (t < t1) t1 = t; }
      }
    }
    return true;
  }

  function opposite(pole) { return pole === 'N' ? 'S' : 'N'; }

  class World {
    constructor(level) {
      this.level = level;
      this.time = 0;
      this.won = false;
      this.winTime = 0;
      this.flags = {};
      this.events = [];
      this.solids = (level.solids || []).map((s, i) => Object.assign({ id: 's' + i, mat: 'stone' }, s));
      this.bodies = (level.bodies || []).map((b) => {
        const k = KINDS[b.kind] || {};
        const body = Object.assign({ vx: 0, vy: 0, grounded: false, attached: null, captured: false,
          ko: false, latched: false, hidden: false, consumed: false, hooked: false, pole: null }, k, b);
        if (k.hook && b.hook !== false) body.hooked = true;
        if (body.randomPole) body.pole = Math.random() < 0.5 ? 'N' : 'S';
        if (body.rail) {
          const r = body.rail;
          body.rail = typeof r === 'string' ? { axis: r } : Object.assign({}, r);
          if (body.rail.axis === 'x') { body.rail.min = body.rail.min ?? body.x; body.rail.max = body.rail.max ?? body.x; }
          else { body.rail.min = body.rail.min ?? body.y; body.rail.max = body.rail.max ?? body.y; }
        }
        return body;
      });
      this.sensors = (level.sensors || []).map((s) => Object.assign({ pressed: false, done: false }, s));
      this.tools = (level.tools || []).map((t) => Object.assign({}, TOOLS[t.type], t));
      this.toolIndex = 0;
      this.flipped = false;
      this.electroOn = false;
      this.turns = level.turns ?? 1;
      this.filings = false;
      this.nailCharge = 0;
      this.finger = { down: false, x: 0, y: 0, px: 0, py: 0 };
      this.crane = level.crane ? { x: level.crane.x, y: level.crane.y } : null;
      this.grabbing = null;          // corps saisi à la main (levier, grue)
      this.sources = [];
      this.pulls = [];
      this.fingerBlocked = false;
      this.cageOpen = 0;             // 0..1 ouverture de la cage
    }

    // ----- entrées -----
    get tool() { return this.tools[this.toolIndex] || null; }
    selectTool(i) { if (i >= 0 && i < this.tools.length) { this.toolIndex = i; this.flipped = false; } }
    flip() { if (this.tool && this.tool.poles) this.flipped = !this.flipped; }
    toggleElectro() { if (this.tool && this.tool.type === 'electro') this.electroOn = !this.electroOn; }
    addTurn() { if (this.turns < 8) this.turns += 1; }
    toggleFilings() { this.filings = !this.filings; }

    pointerDown(x, y) {
      this.finger.down = true; this.finger.x = this.finger.px = x; this.finger.y = this.finger.py = y;
      // Saisie à la main : levier ou grue
      for (const b of this.bodies) {
        if (b.grab && !b.hidden && pointIn({ x, y }, { x: b.x - 25, y: b.y - 25, w: b.w + 50, h: b.h + 50 })) {
          this.grabbing = { body: b, dy: y - b.y, dx: x - b.x }; return;
        }
      }
      // Passage secret : on tape sur le mur
      for (const s of this.sensors) {
        if (s.type === 'secret' && !s.done && pointIn({ x, y }, s)) {
          s.done = true; this.flags[s.id] = true; this.events.push({ type: 'secret', id: s.id });
          (s.reveals || []).forEach((id) => { const b = this.body(id); if (b) b.hidden = false; });
        }
      }
    }
    pointerMove(x, y) { this.finger.x = x; this.finger.y = y; }
    pointerUp() { this.finger.down = false; this.grabbing = null; }

    body(id) { return this.bodies.find((b) => b.id === id); }
    sensor(id) { return this.sensors.find((s) => s.id === id); }
    captured(id) { const b = this.body(id); return !!(b && b.captured); }
    pressed(id) { const s = this.sensor(id); return !!(s && s.pressed); }
    latched(id) { const b = this.body(id); return !!(b && b.latched); }
    ko(id) { const b = this.body(id); return !!(b && b.ko); }
    railAtMax(id) { const b = this.body(id); if (!b || !b.rail) return false; const v = b.rail.axis === 'x' ? b.x : b.y; return v >= b.rail.max - 2; }
    railAtMin(id) { const b = this.body(id); if (!b || !b.rail) return false; const v = b.rail.axis === 'x' ? b.x : b.y; return v <= b.rail.min + 2; }

    fingerInZone() {
      const z = this.level.zone;
      if (!z) return true;
      const zones = Array.isArray(z) ? z : [z];
      return zones.some((r) => pointIn(this.finger, r));
    }

    // ----- sources magnétiques actives -----
    computeSources() {
      const src = [];
      const tool = this.tool;
      if (tool) {
        if (tool.type === 'electro') {
          const pos = this.crane || { x: W / 2, y: 200 };
          if (this.electroOn) {
            const k = Math.min(this.turns, 8) / (this.level.turnsNeeded || 1);
            const strength = tool.strength * Math.min(k, 1.5);
            src.push({ kind: 'electro', x: pos.x, y: pos.y + 18, strength, range: tool.range,
              liftMass: tool.liftMass * k, poleLeft: null, poleRight: null, root: true });
          }
        } else if (tool.type !== 'compass') {
          const inZone = this.fingerInZone();
          this.fingerBlocked = this.finger.down && !inZone;
          let active = this.finger.down && inZone;
          let strength = tool.strength, liftMass = tool.liftMass;
          if (tool.type === 'nail') {
            active = active && this.nailCharge > 0.02;
            strength *= 0.4 + 0.6 * this.nailCharge;
          }
          if (active) {
            src.push({ kind: tool.type, x: this.finger.x, y: this.finger.y, strength, range: tool.range,
              liftMass, poleLeft: tool.poles ? (this.flipped ? 'N' : 'S') : null,
              poleRight: tool.poles ? (this.flipped ? 'S' : 'N') : null, root: true });
          }
        }
      }
      // Aimants fixes du niveau (cachés ou non)
      for (const m of this.level.magnets || []) {
        src.push(Object.assign({ kind: 'fixed', liftMass: 0, poleLeft: null, poleRight: null, root: true, strength: 6000, range: 180 }, m));
      }
      // Un aimant qui tient déjà un corps : les corps « chaînables » s'accrochent au bout de la chaîne, pas à lui
      for (const s of src) {
        if (s.root) s.hasChild = this.bodies.some((b) => b.attached && !b.attached.parentBody && b.attached.sourceKind === s.kind);
      }
      // Corps aimantés par contact : le dernier maillon accroché devient une petite source (force venue de l'aimant d'origine)
      for (const b of this.bodies) {
        if (b.attached && !b.hidden && !b.child) {
          let p = b;
          while (p.attached && p.attached.parentBody) p = p.attached.parentBody;
          const rootSrc = p.attached && src.find((s) => s.root && s.kind === p.attached.sourceKind);
          if (!rootSrc) continue;
          const c = center(b);
          src.push({ kind: 'induced', x: c.x, y: b.y + b.h - 4, strength: rootSrc.strength * 0.75, range: rootSrc.range * 0.65,
            liftMass: rootSrc.liftMass, poleLeft: null, poleRight: null, root: false, body: b, chainOnly: true });
        }
      }
      return src;
    }

    blockedByIron(p1, p2) {
      for (const s of this.solids) if (s.mat === 'iron' && segmentHitsRect(p1, p2, s)) return true;
      return false;
    }

    // Signe de l'interaction : +1 attire, -1 repousse
    sign(src, b) {
      if (!b.pole || !src.poleLeft) return 1;
      const c = center(b);
      const dx = c.x - src.x, dy = c.y - src.y;
      if (Math.abs(dx) < Math.abs(dy) * 0.6) return 1; // au-dessus / en-dessous : neutre
      const srcFacing = dx > 0 ? src.poleRight : src.poleLeft;         // pôle de l'aimant tourné vers le corps
      const bodyFacing = dx > 0 ? b.pole : opposite(b.pole);              // b.pole = pôle sur le côté gauche du corps
      return srcFacing === bodyFacing ? -1 : 1;
    }

    step(dt) {
      // sous-pas fixes
      let acc = dt;
      while (acc > 0) { const h = Math.min(DT, acc); this.substep(h); acc -= h; }
    }

    substep(dt) {
      this.time += dt;
      const tool = this.tool;
      const f = this.finger;

      // --- grue : la position suit le doigt quand on la tient ---
      if (tool && tool.type === 'electro' && f.down && this.crane) {
        const z = this.level.craneZone || { x: 40, y: 90, w: W - 80, h: 520 };
        this.crane.x = Math.max(z.x, Math.min(z.x + z.w, f.x));
        this.crane.y = Math.max(z.y, Math.min(z.y + z.h, f.y));
      }
      // --- levier saisi à la main ---
      if (this.grabbing) {
        const b = this.grabbing.body;
        if (b.rail) {
          if (b.rail.axis === 'y') b.y = Math.max(b.rail.min, Math.min(b.rail.max, f.y - this.grabbing.dy));
          else b.x = Math.max(b.rail.min, Math.min(b.rail.max, f.x - this.grabbing.dx));
        }
      }
      // --- clou frotté sur la magnétite ---
      if (tool && tool.type === 'nail') {
        const lode = this.level.lodestone;
        if (f.down && lode && pointIn(f, lode)) {
          const moved = Math.hypot(f.x - f.px, f.y - f.py);
          if (moved > 0) this.nailCharge = Math.min(1, this.nailCharge + moved * 0.0035);
        }
        this.nailCharge = Math.max(0, this.nailCharge - dt / 14);
      }
      f.px = f.x; f.py = f.y;

      const sources = this.computeSources();
      this.sources = sources;
      const pulls = [];

      // --- forces magnétiques et accroches ---
      for (const b of this.bodies) {
        if (b.hidden || b.captured || b.latched || b.consumed || b.mat !== 'iron') continue;
        if (b.grab) continue;
        if (b.attached) continue;
        if (b.lockedUntil && !b.lockedUntil(this)) continue;
        const c = center(b);
        let ax = 0, ay = 0, anyPull = false;
        for (const s of sources) {
          if (s.chainOnly && !b.chain) continue;
          if (b.chain && s.root && s.hasChild) continue;
          if (s.body === b || (s.body && s.body.child)) continue;
          const d = dist(s, c);
          const reach = s.range + Math.max(b.w, b.h) * 0.35;
          if (d > reach || d < 0.5) continue;
          if (this.blockedByIron(s, c)) continue;
          const sg = this.sign(s, b);
          const mag = s.strength * Math.max(0, 1 - d / reach) * sg;
          const ux = (s.x - c.x) / d, uy = (s.y - c.y) / d;
          const canLift = s.liftMass >= b.mass;
          ax += ux * mag / b.mass;
          if (canLift) ay += uy * mag / b.mass;
          anyPull = true;
          pulls.push({ from: s, to: c, sign: sg });
          // accroche : corps léger assez proche d'un aimant qui l'attire
          if (canLift && sg > 0) {
            if (s.kind === 'induced') {
              // maillon de chaîne : il s'accroche dès qu'il touche le maillon précédent
              if (dist(center(s.body), c) < (b.h + s.body.h) / 2 + 12) { this.attach(b, s); break; }
            } else {
              const top = { x: c.x, y: b.y };
              const dTop = dist(s, top);
              const attachDist = 34 + (s.kind === 'horseshoe' ? 10 : 0);
              if (dTop < attachDist || (d < attachDist + b.h * 0.5 && dTop < attachDist + 18)) {
                this.attach(b, s);
                break;
              }
            }
          }
        }
        if (b.attached) continue;
        if (anyPull && b.hooked) { b.hooked = false; this.events.push({ type: 'unhook', id: b.id }); }
        b.ax = ax; b.ay = ay;
      }
      this.pulls = pulls;

      // --- intégration ---
      for (const b of this.bodies) {
        if (b.hidden || b.latched || b.consumed || b.grab) continue;
        if (b.captured) { b.vy += G * dt; b.y += b.vy * dt; if (b.y > H + 200) b.hidden = true; continue; }
        if (b.attached) { this.followSource(b); continue; }
        if (b.hooked) { b.vx = b.vy = 0; continue; }
        const ax = b.ax || 0, ay = b.ay || 0;
        if (b.rail) {
          if (b.rail.axis === 'x') {
            b.vx += ax * dt;
            if (b.rail.flingAt !== undefined && b.x > b.rail.flingAt) b.vx = Math.max(b.vx, 700);
            else { b.vx *= Math.exp(-5 * dt); b.vx = Math.max(-500, Math.min(500, b.vx)); }
            if (Math.abs(ax) < 250 && Math.abs(b.vx) < 40) b.vx = 0;
            b.x = Math.max(b.rail.min, Math.min(b.rail.max, b.x + b.vx * dt));
            if (b.pole) this.stopAtMagnet(b);
            if (b.x === b.rail.min || b.x === b.rail.max) b.vx = 0;
          } else {
            if (b.gravity) b.vy += G * dt;
            b.vy += ay * dt;
            b.vy *= Math.exp(-5 * dt); b.vy = Math.max(-500, Math.min(600, b.vy));
            if (!b.gravity && Math.abs(ay) < 250 && Math.abs(b.vy) < 40) b.vy = 0;
            b.y = Math.max(b.rail.min, Math.min(b.rail.max, b.y + b.vy * dt));
            if (b.y === b.rail.min || b.y === b.rail.max) b.vy = 0;
          }
        } else {
          b.vy += (G + ay) * dt;
          b.vx += ax * dt;
          if (b.grounded) {
            const fr = Math.min(Math.abs(b.vx), 500 * dt);
            b.vx -= Math.sign(b.vx) * fr;
            if (Math.abs(ax) < 350 && Math.abs(b.vx) < 30) b.vx = 0;
          } else {
            b.vx *= Math.exp(-0.6 * dt);
          }
          const ms = b.maxSpeed || 900; b.vx = Math.max(-ms, Math.min(ms, b.vx));
          b.vy = Math.max(-1200, Math.min(1500, b.vy));
          this.moveWithCollisions(b, dt);
        }
        b.ax = b.ay = 0;
      }

      // --- interactions : épée sur chevalier ---
      for (const s of this.bodies) {
        if (s.tag !== 'blade' || s.hidden || s.attached) continue;
        if (s.vy < 150) continue;
        for (const k of this.bodies) {
          if (k.tag !== 'knight' || k.ko || k.hidden || k.captured) continue;
          const overlapX = s.x < k.x + k.w && s.x + s.w > k.x;
          if (overlapX && s.y + s.h >= k.y && s.y + s.h <= k.y + k.h * 0.6) {
            this.knockOut(k);
            s.y = k.y + k.h - s.h; s.vy = 0; s.grounded = true;
          }
        }
      }

      // --- capteurs ---
      for (const sn of this.sensors) {
        if (sn.type === 'trap') {
          for (const b of this.bodies) {
            if (b.hidden || b.captured || b.attached || b.latched) continue;
            if (sn.body && sn.body !== b.id) continue;
            if (b.tag === 'straw') continue;
            const c = center(b);
            if (pointIn({ x: c.x, y: b.y + b.h - 4 }, sn) && (b.tag === 'knight' || b.tag === 'straw')) {
              b.captured = true; b.vy = Math.max(0, b.vy); b.vx = 0;
              this.events.push({ type: 'captured', id: b.id });
            }
          }
        } else if (sn.type === 'button') {
          let on = false;
          for (const b of this.bodies) {
            if (b.hidden || b.captured || b.attached) continue;
            if (sn.minMass && b.mass < sn.minMass) continue;
            const overlapX = b.x < sn.x + sn.w && b.x + b.w > sn.x;
            const bottom = b.y + b.h;
            if (overlapX && bottom >= sn.y - 4 && bottom <= sn.y + sn.h + 4) on = true;
          }
          if (on && !sn.pressed) this.events.push({ type: 'button', id: sn.id });
          sn.pressed = on || (sn.sticky && sn.pressed);
          if (sn.pressed && sn.removes) {
            this.solids = this.solids.filter((s) => s.id !== sn.removes);
            sn.removes = null; this.events.push({ type: 'open', id: sn.id });
          }
        } else if (sn.type === 'latch') {
          const b = this.body(sn.body);
          if (b && !b.latched && !b.hidden && pointIn(center(b), sn)) {
            b.latched = true; this.detach(b); b.vx = b.vy = 0;
            if (sn.snapY !== undefined) b.y = sn.snapY;
            this.events.push({ type: 'latched', id: b.id });
          }
        } else if (sn.type === 'keyhole') {
          const b = this.body(sn.body);
          if (b && !b.consumed && !b.hidden && pointIn(center(b), sn)) {
            b.consumed = true; b.hidden = true; b.attached = null; sn.pressed = true;
            this.events.push({ type: 'key', id: sn.id });
          }
        }
      }

      // --- victoire ---
      if (!this.won && this.level.win && this.level.win(this)) {
        this.won = true; this.winTime = this.time; this.events.push({ type: 'win' });
      }
      if (this.won) this.cageOpen = Math.min(1, this.cageOpen + dt * 1.2);
    }

    attach(b, s) {
      b.attached = { source: s, sourceKind: s.kind, parentBody: s.body || null };
      if (s.body) s.body.child = b; else if (b.chain) s.hasChild = true;
      b.vx = b.vy = 0; b.hooked = false; b.grounded = false;
      this.events.push({ type: 'attach', id: b.id });
      this.followSource(b);
    }

    // Un corps accroché suit sa source ; s'il rentre dans un mur, il se décroche.
    followSource(b) {
      const a = b.attached;
      let src = null;
      if (a.parentBody) {
        const p = a.parentBody;
        if (!p.attached || p.hidden) { this.detach(b); return; }
        src = { x: p.x + p.w / 2, y: p.y + p.h - 4 };
      } else {
        src = this.sources.find((s) => s.root && s.kind === a.sourceKind) || null;
        if (!src) { this.detach(b); return; }
        a.source = src; // garde à jour la force transmise
      }
      let nx = src.x - b.w / 2, ny = src.y + 4;
      if (b.rail) {
        if (b.rail.axis === 'y') { nx = b.x; ny = Math.max(b.rail.min, Math.min(b.rail.max, ny)); }
        else { ny = b.y; nx = Math.max(b.rail.min, Math.min(b.rail.max, nx)); }
      }
      const probe = { x: nx, y: ny, w: b.w, h: b.h };
      for (const s of this.solids) {
        if (!rectsOverlap(probe, s)) continue;
        const overlapTop = probe.y + probe.h - s.y;     // le corps traîne sur un sol : on le pose dessus
        if (!b.rail && overlapTop > 0 && probe.y <= s.y + 2 && probe.x + probe.w > s.x + 4 && probe.x < s.x + s.w - 4) {
          ny = s.y - b.h; probe.y = ny; continue;
        }
        this.detach(b); return;
      }
      b.x = nx; b.y = ny;
    }

    detach(b) {
      if (b.attached && b.attached.parentBody) b.attached.parentBody.child = null;
      b.attached = null; b.vx = 0; b.vy = 0; b.grounded = false;
      if (b.child) { const c = b.child; b.child = null; this.detach(c); }
      this.events.push({ type: 'detach', id: b.id });
    }

    knockOut(k) {
      k.ko = true; k.tag = 'knight'; k.koTime = this.time;
      const bottom = k.y + k.h;
      k.h = 62; k.w = 110; k.x -= 20; k.y = bottom - k.h;
      k.vx = 0; k.vy = 0;
      this.events.push({ type: 'ko', id: k.id });
    }

    // Les corps qui portent un aimant ne passent pas à travers l'aimant du doigt
    stopAtMagnet(b) {
      for (const s of this.sources) {
        if (!s.root || s.kind === 'fixed' || s.kind === 'electro') continue;
        const m = { x: s.x - 34, y: s.y - 20, w: 68, h: 40 };
        if (!rectsOverlap(b, m)) continue;
        const cx = b.x + b.w / 2;
        if (cx < s.x) b.x = m.x - b.w; else b.x = m.x + m.w;
        b.vx = 0;
      }
    }

    moveWithCollisions(b, dt) {
      // X
      b.x += b.vx * dt;
      for (const s of this.solids) {
        if (!rectsOverlap(b, s)) continue;
        if (b.vx > 0) b.x = s.x - b.w; else if (b.vx < 0) b.x = s.x + s.w;
        b.vx = 0;
      }
      if (b.pole) this.stopAtMagnet(b);
      // Y
      const wasGrounded = b.grounded, vyBefore = b.vy;
      b.y += b.vy * dt;
      b.grounded = false;
      for (const s of this.solids) {
        if (!rectsOverlap(b, s)) continue;
        if (b.vy > 0) { b.y = s.y - b.h; b.grounded = true; if (!wasGrounded && vyBefore > 250) this.events.push({ type: 'land', id: b.id, v: vyBefore }); }
        else if (b.vy < 0) b.y = s.y + s.h;
        b.vy = 0;
      }
      // sol de secours
      if (b.y + b.h > H + 300) { b.hidden = true; }
      if (b.x < -200 || b.x > W + 200) b.hidden = true;
    }

    // Direction de la boussole (vers la cible désignée par le niveau)
    compassAngle() {
      const t = this.level.compassTarget; if (!t) return null;
      return Math.atan2(t.y - this.finger.y, t.x - this.finger.x);
    }

    drainEvents() { const e = this.events; this.events = []; return e; }
  }

  // Script de doigt : [['down',x,y,t], ['move',x,y,t], ['up',t], ['flip',t], ['tool',i,t], ['electro',t], ['turn',t], ['filings',t], ['tap',x,y,t], ['wait',t]]
  // t = temps absolu (secondes) auquel l'action est terminée ; un 'move' interpole depuis la position précédente.
  class Replay {
    constructor(world, steps) { this.w = world; this.steps = steps; this.i = 0; this.t = 0; this.pos = { x: 0, y: 0 }; this.from = { x: 0, y: 0 }; this.anchorT = 0; this.done = false; }
    get hand() { const s = this.steps[Math.min(this.i, this.steps.length - 1)]; return { x: this.pos.x, y: this.pos.y, down: this.w.finger.down, label: s && s[0] }; }
    step(dt) {
      if (this.done) return;
      this.t += dt;
      const w = this.w;
      while (this.i < this.steps.length) {
        const s = this.steps[this.i];
        const endT = s[s.length - 1];
        if (s[0] === 'move') {
          const x = s[1], y = s[2];
          if (this.t < endT) {
            const k = Math.max(0, Math.min(1, (this.t - this.anchorT) / Math.max(1e-6, endT - this.anchorT)));
            const nx = this.from.x + (x - this.from.x) * k, ny = this.from.y + (y - this.from.y) * k;
            this.pos = { x: nx, y: ny }; if (w.finger.down) w.pointerMove(nx, ny);
            return;
          }
          this.pos = { x, y }; if (w.finger.down) w.pointerMove(x, y);
        } else if (this.t < endT) {
          return;
        } else {
          switch (s[0]) {
            case 'down': this.pos = { x: s[1], y: s[2] }; w.pointerDown(s[1], s[2]); break;
            case 'up': w.pointerUp(); break;
            case 'flip': w.flip(); break;
            case 'tool': w.selectTool(s[1]); break;
            case 'electro': w.toggleElectro(); break;
            case 'turn': w.addTurn(); break;
            case 'filings': w.toggleFilings(); break;
            case 'tap': this.pos = { x: s[1], y: s[2] }; w.pointerDown(s[1], s[2]); w.pointerUp(); break;
            case 'wait': break;
          }
        }
        this.i++; this.anchorT = endT; this.from = { x: this.pos.x, y: this.pos.y };
      }
      this.done = true;
    }
  }

  const Engine = { World, Replay, TOOLS, KINDS, W, H, G, segmentHitsRect, rectsOverlap, pointIn };
  if (typeof module !== 'undefined' && module.exports) module.exports = Engine; else root.Engine = Engine;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Les 16 étages de la tour. Chaque étage = (atelier) + salle 1 + salle 2.
   Coordonnées logiques 1280×800 (zone de jeu : y de 90 à 800).
   Chaque salle a une démo (script de doigt) : elle sert d'exemple dans l'atelier, de « Montre-moi », et de test automatique. */
(function (root) {
  'use strict';

  const FLOOR = 720;
  const KY = FLOOR - 110;
  const WALLS = () => [
    { id: 'ceil', x: 0, y: 90, w: 1280, h: 20, mat: 'stone' },
    { id: 'wallL', x: 0, y: 90, w: 40, h: 710, mat: 'stone' },
    { id: 'wallR', x: 1240, y: 90, w: 40, h: 710, mat: 'stone' },
  ];
  // Sol avec des trous [[a,b],...]
  function room(gaps = []) {
    const s = WALLS();
    let x = 0, i = 0;
    for (const [a, b] of gaps) { s.push({ id: 'floor' + i++, x, y: FLOOR, w: a - x, h: 80, mat: 'stone' }); x = b; }
    s.push({ id: 'floor' + i, x, y: FLOOR, w: 1280 - x, h: 80, mat: 'stone' });
    return s;
  }
  const trap = (id, a, b, y = FLOOR) => ({ id, type: 'trap', x: a, y: y + 2, w: b - a, h: 70 });
  const glass = (x) => ({ id: 'glass' + x, x, y: 110, w: 20, h: 610, mat: 'glass' });
  const niche = (x, id = '') => [{ id: 'nL' + id, x: x - 50, y: 560, w: 24, h: 160, mat: 'stone' }, { id: 'nR' + id, x: x + 96, y: 560, w: 24, h: 160, mat: 'stone' }];
  const latchAt = (id, body, x, y, w, snapY) => ({ id, type: 'latch', body, x, y, w, h: 36, snapY });

  // Constructeur de démo : temps cumulé
  function D() {
    const steps = []; let t = 0;
    const api = {
      down(x, y, d = 0.3) { t += d; steps.push(['down', x, y, t]); return api; },
      move(x, y, d) { t += d; steps.push(['move', x, y, t]); return api; },
      up(d = 0.15) { t += d; steps.push(['up', t]); return api; },
      flip(d = 0.4) { t += d; steps.push(['flip', t]); return api; },
      tool(i, d = 0.5) { t += d; steps.push(['tool', i, t]); return api; },
      electro(d = 0.5) { t += d; steps.push(['electro', t]); return api; },
      turn(d = 0.35) { t += d; steps.push(['turn', t]); return api; },
      filings(d = 0.4) { t += d; steps.push(['filings', t]); return api; },
      tap(x, y, d = 0.4) { t += d; steps.push(['tap', x, y, t]); return api; },
      wait(d) { t += d; steps.push(['wait', t]); return api; },
      rub(n = 10) { for (let i = 0; i < n; i++) { api.move(300, 620, 0.25); api.move(130, 600, 0.25); } return api; },
      end() { return steps; },
    };
    return api;
  }
  // Pêche à la chaîne : anneaux de x1 à x2 (hauteur de ramassage 230), puits à wx, serrure à kx
  const fish = (d, x1, x2, wx, kx, ky = 150) => d.down(x1, 366).wait(0.3).move(x1, 230, 0.5).move(x2, 230, 3.5).wait(0.4).move(wx, 230, 1.5).move(wx, 412, 2).wait(1.5).move(wx, ky, 2).move(kx, ky, 2).wait(1.2);

  const bar = [{ type: 'bar' }];
  const F = [];

  // 1 ------------------------------------------------------------ L'aimant
  F.push({ n: 1, title: "L'aimant", taunt: 'Ha ha ! Trop tard !', rooms: [

  // La sorcière arrive par la fenêtre, attrape la cage, et repart avec le chat
  function startFlight() {

  const easeOut = (k) => 1 - Math.pow(1 - k, 3), easeIn = (k) => k * k * k;

  // ---------- particules ----------
  function spawnBurst(x, y, n, color, speed) {

  function spawnSmoke(x, y, n, scale = 1) {

  }
  function spawnRing(x, y, color, r) { particles.push({ x, y, vx: 0, vy: 0, life: 0.5, t: 0, color, size: r, g: 0, kind: 'ring' }); }
  function confetti() {
    const n = REDUCED ? 20 : 80, colors = ['#ffb020', '#7ad3ff', '#e0453a', '#3fbf5a', '#fff6e6', '#c77dff'];
    for (let i = 0; i < n; i++) particles.push({ x: Math.random() * W, y: 60 + Math.random() * 100, vx: (Math.random() - 0.5) * 200, vy: 100 + Math.random() * 200, life: 2.2 + Math.random(), t: 0, color: colors[i % colors.length], size: 8 + Math.random() * 8, g: 300, kind: 'confetti', rot: Math.random() * 6, vr: (Math.random() - 0.5) * 10 });
  }
  function updateParticles(dt) {

  function drawParticles() {

    }
    ctx.globalAlpha = 1;
  }

  // ---------- dessin ----------

  function drawBricks() {

  }
  function drawPulls(time) {
    for (const p of world.pulls) {
      const dx = p.from.x - p.to.x, dy = p.from.y - p.to.y, d = Math.hypot(dx, dy) || 1;
      const ux = dx / d, uy = dy / d;

  }
  function drawMagnet(time) {
    const w = world, t = w.tool; if (!t) return;

      const g = ctx.createRadialGradient(x, y, 10, x, y, src.range + pulse); g.addColorStop(0, 'rgba(255,230,140,0.16)'); g.addColorStop(1, 'rgba(255,230,140,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, src.range + pulse, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(255,240,200,0.4)'; ctx.setLineDash([10, 12]); ctx.lineDashOffset = -time * 40; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, src.range + pulse, 0, 7); ctx.stroke(); ctx.setLineDash([]); ctx.lineDashOffset = 0;
      // étincelles qui tournent
      for (let i = 0; i < 3; i++) { const a = time * 3 + i * 2.1; ctx.fillStyle = 'rgba(255,240,160,0.9)'; ctx.beginPath(); ctx.arc(x + Math.cos(a) * 52, y + Math.sin(a) * 40, 3, 0, 7); ctx.fill(); }
    }
    drawHero(hero.x, hero.y, time);
    if (t.type === 'bar') drawBar(x - 36, y - 15, 72, 30, w.flipped, false);
    else if (t.type === 'double') { drawBar(x - 42, y - 30, 84, 28, w.flipped, false); drawBar(x - 42, y + 2, 84, 28, w.flipped, false); }
    else if (t.type === 'horseshoe') drawHorseshoe(x, y, w.flipped);
    else if (t.type === 'nail') drawNail(x, y, w.nailCharge);
    else if (t.type === 'compass') drawCompass(x, y);

    ctx.restore();
  }
  function drawHorseshoe(x, y, flipped) {
    ctx.lineWidth = 22; ctx.lineCap = 'butt';
    ctx.strokeStyle = C.red; ctx.beginPath(); ctx.arc(x, y - 10, 30, Math.PI, Math.PI * 2); ctx.stroke();

    ctx.fillStyle = flipped ? C.blue : C.red; ctx.fillRect(x + 19, y - 10, 22, 34);
    ctx.fillStyle = C.red; ctx.fillRect(x - 41, y - 12, 22, 4); ctx.fillRect(x + 19, y - 12, 22, 4);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 18px Fredoka, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(flipped ? 'N' : 'S', x - 30, y + 14); ctx.fillText(flipped ? 'S' : 'N', x + 30, y + 14);
  }
  function drawNail(x, y, charge) {
    if (charge > 0.02) { const g = ctx.createRadialGradient(x, y, 5, x, y, 70); g.addColorStop(0, `rgba(120,200,255,${0.5 * charge})`); g.addColorStop(1, 'rgba(120,200,255,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 70, 0, 7); ctx.fill(); }
    ctx.fillStyle = '#b8bec6'; ctx.fillRect(x - 5, y - 30, 10, 60); ctx.fillStyle = '#8e959e'; rr(x - 14, y - 36, 28, 10, 4); ctx.fill();
    ctx.fillStyle = '#b8bec6'; ctx.beginPath(); ctx.moveTo(x - 5, y + 30); ctx.lineTo(x + 5, y + 30); ctx.lineTo(x, y + 44); ctx.fill();
  }
  function drawCompass(x, y) {
    ctx.fillStyle = '#f7f1e3'; ctx.beginPath(); ctx.arc(x, y, 46, 0, 7); ctx.fill();
    ctx.strokeStyle = '#3a3a3a'; ctx.lineWidth = 5; ctx.stroke();
    const a = world.compassAngle();
    if (a !== null) {
      ctx.save(); ctx.translate(x, y); ctx.rotate(a);
      ctx.fillStyle = C.red; ctx.beginPath(); ctx.moveTo(38, 0); ctx.lineTo(0, -9); ctx.lineTo(0, 9); ctx.fill();
      ctx.fillStyle = C.blue; ctx.beginPath(); ctx.moveTo(-38, 0); ctx.lineTo(0, -9); ctx.lineTo(0, 9); ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle = '#3a3a3a'; ctx.beginPath(); ctx.arc(x, y, 5, 0, 7); ctx.fill();
  }
  function drawCrane(time) {
    const c = world.crane; if (!c) return;
    const on = world.electroOn;
    ctx.fillStyle = '#2c3036'; ctx.fillRect(40, 110, W - 80, 10);
    ctx.fillStyle = '#5a6068'; rr(c.x - 30, 104, 60, 22, 6); ctx.fill();
    ctx.strokeStyle = '#2c3036'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(c.x, 126); ctx.lineTo(c.x, c.y - 30); ctx.stroke();
    const turns = world.turns;
    ctx.fillStyle = '#8e959e'; rr(c.x - 36, c.y - 30, 72, 44, 8); ctx.fill();
    ctx.strokeStyle = '#d96b2b'; ctx.lineWidth = 4;
    for (let i = 0; i < turns; i++) { const yy = c.y - 24 + i * (34 / Math.max(1, turns - 1) || 0); ctx.beginPath(); ctx.moveTo(c.x - 30, yy); ctx.lineTo(c.x + 30, yy + 4); ctx.stroke(); }
    ctx.fillStyle = on ? '#ffd24a' : '#4a4f56'; rr(c.x - 44, c.y + 10, 88, 14, 7); ctx.fill();
    if (on) {
      const g = ctx.createRadialGradient(c.x, c.y + 18, 6, c.x, c.y + 18, 70); g.addColorStop(0, 'rgba(255,220,80,0.5)'); g.addColorStop(1, 'rgba(255,220,80,0)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(c.x, c.y + 18, 70, 0, 7); ctx.fill();
      for (let i = 0; i < 3; i++) { const a = time * 6 + i * 2.1; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(c.x + Math.cos(a) * 50, c.y + 18 + Math.sin(a) * 30, 2.5, 0, 7); ctx.fill(); }
    }
    const src = world.sources.find((s) => s.kind === 'electro');
    if (src) { ctx.strokeStyle = 'rgba(255,240,200,0.3)'; ctx.setLineDash([10, 12]); ctx.lineDashOffset = -time * 40; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(src.x, src.y, src.range, 0, 7); ctx.stroke(); ctx.setLineDash([]); ctx.lineDashOffset = 0; }
    ctx.fillStyle = C.text; ctx.font = 'bold 22px Nunito, sans-serif'; ctx.textAlign = 'center'; ctx.fillText(on ? 'ALLUMÉ' : 'ÉTEINT', c.x, c.y - 44);
    if (demo) { ctx.fillText('Regarde…', c.x, c.y - 72); }
  }
  function drawFilings() {
    const src = world.sources.find((s) => s.root && s.poleLeft);
    const targets = [];
    if (src) targets.push({ x: src.x, y: src.y, w: 72 });
    for (const b of world.bodies) if (b.pole && !b.hidden) targets.push({ x: b.x + b.w / 2, y: b.y + b.h * 0.45 + 13, w: b.w + 28 });
    ctx.strokeStyle = 'rgba(60,60,70,0.85)'; ctx.lineWidth = 2;
    for (const t of targets) {
      for (let i = 1; i <= 4; i++) { ctx.beginPath(); ctx.ellipse(t.x, t.y, t.w / 2 + i * 26, 14 + i * 20, 0, 0, 7); ctx.stroke(); }
      ctx.fillStyle = 'rgba(40,40,50,0.8)';
      for (let i = 0; i < 60; i++) { const a = (i / 60) * Math.PI * 2; const r = 30 + (i % 5) * 18; ctx.fillRect(t.x + Math.cos(a) * (t.w / 2 + r) - 1, t.y + Math.sin(a) * (10 + r * 0.7) - 1, 3, 3); }
    }
  }
  function drawDark() {
    const f = world.finger;
    ctx.save();
    if (f.down) {
      const g = ctx.createRadialGradient(f.x, f.y, 40, f.x, f.y, 220);
      g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.7, 'rgba(0,0,0,0.75)'); g.addColorStop(1, 'rgba(0,0,0,0.93)');

    } else { ctx.fillStyle = 'rgba(0,0,0,0.9)'; ctx.fillRect(0, 90, W, H - 90); }

    const sec = world.sensor('secret');
    if (world.won || (sec && sec.done)) return;
    ctx.fillStyle = C.text; ctx.font = 'bold 26px Nunito, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('Touche l’écran : la boussole montre où chercher.', W / 2, 150);
  }
  function drawFlashes() {
    for (const f of flashes) {
      f.t -= 1 / 60;
      ctx.globalAlpha = Math.max(0, Math.min(1, f.t * 2));
      ctx.font = 'bold 44px Fredoka, sans-serif'; ctx.fillStyle = C.gold; ctx.textAlign = 'center'; ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 6;

  }

    if (bannerSub) { ctx.fillStyle = C.text; ctx.font = 'bold 22px Nunito, sans-serif'; wrapText(fr(bannerSub), W / 2, 296 + slide, 680, 26); }
    ctx.restore();
  }
  function wrapText(text, x, y, maxW, lh) {
    const words = text.split(' '); let line = '';

    if (line) ctx.fillText(line, x, y);
  }

  // ---------- démarrage ----------
  function loadImages(cb) {
    let n = ASSETS.length;
    for (const name of ASSETS) {
      const im = new Image();
      im.onload = im.onerror = () => { IMG[name] = im.complete && im.naturalWidth ? im : null; if (--n === 0) cb(); };
      im.src = `assets/${name}.png`;
    }
  }
  function boot(state) {

    initTitle();
    if (state && state.screen === 'tower') { show('tower'); renderTower(); } else show('title');
    if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ screen: current === 'title' ? 'title' : 'tower' }));
  }
  loadImages(() => {
    const hot = window.claude && window.claude.hot;

})();
